/**:
  ros__parameters:
    # 动态障碍物停止模块参数
    # 功能：在自车即将进入运动物体（如横穿的行人、车辆）的即时路径前，
    #       规划一个停车点，避免碰撞。
    dynamic_obstacle_stop:
      # 检测到的物体周围的额外宽度 [m]，在物体实际边界基础上向外扩展，
      # 相当于为碰撞判定增加安全余量。
      # extra_object_width: 1.0  # [m] extra width around detected objects
      extra_object_width: 0.5

      # 最低物体速度 [m/s]，速度低于此值的物体将被忽略。
      # 用于过滤静止或极慢速的障碍物（它们可能由其他模块处理）。
      minimum_object_velocity: 0.5

      # 停车距离缓冲 [m]，在计算出的碰撞点前额外增加的停车距离，
      # 确保自车停稳后与物体保持安全间隙。
      stop_distance_buffer: 0.5

      # 碰撞检测的时间范围 [s]。
      # 仅考虑在此时间范围内可能发生的碰撞。
      time_horizon: 3.0

      # 迟滞值 [m]，用于防止停车决策在碰撞边界附近反复切换。
      # 当已检测到碰撞后，必须等到碰撞距离超过该迟滞值才取消停车。
      hysteresis: 1.0

      # 添加停车决策的持续时间缓冲 [s]。
      # 只有当碰撞条件持续存在超过该时间，才会真正生成停车点，
      # 避免因瞬间检测噪声而产生误刹车。
      add_stop_duration_buffer: 0.5

      # 移除停车决策的持续时间缓冲 [s]。
      # 当碰撞消失后，需等待该时长才清除停车点，
      # 防止因短暂无碰撞信号而过早起步。
      remove_stop_duration_buffer: 1.0

      # 自车轨迹与物体间的最小考虑距离 [m]。
      # 仅当物体轮廓与自车预测轨迹的最短距离小于此值时，
      # 才将其纳入碰撞检查，过滤远处无关物体。
      minimum_object_distance_from_ego_trajectory: 1.0

      # 是否忽略无法通过停车避免的碰撞。
      # 若为 true，即使立即制动也无法避免碰撞（因为距离太近且物体继续直行），
      # 则不生成停车点，避免无意义的急刹干扰。
      ignore_unavoidable_collisions: true