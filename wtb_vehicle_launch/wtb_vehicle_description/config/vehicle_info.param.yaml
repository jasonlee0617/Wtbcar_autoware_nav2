# ================================================================
# vehicle_info.param.yaml - Autoware 车辆物理参数
# ================================================================
# 功能：
#   定义 WTB 小车的物理尺寸、运动学约束与几何参数。
#   被 Autoware 的 individual_params 系统和 vehicle.xacro 中的
#   xacro.load_yaml() 加载，供规划/控制/避障/可视化模块使用。
#
# 加载路径：
#   vehicle.xacro:
#     ${xacro.load_yaml('$(find wtb_vehicle_description)/config/vehicle_info.param.yaml')}
#   规划模块通过 topic /vehicle_info 或 launch 参数注入。
#
# 坐标系约定（参考 base_link）：
#   base_link 原点 = 后轴中心在地面的投影 (x=0, y=0, z=0)。
#   +X = 前方（车头方向），+Y = 左侧，+Z = 上方。
#   车体 box 中心位于 (wheel_base/2, 0, base_link_to_body_center_z)。
#
# 当前车辆：WTB 小车，后轮驱动/转向，最大速度约 1.0 m/s。
# ================================================================
/**:
  ros__parameters:
    # ==================================================================
    # 1. 车体外形尺寸
    # ==================================================================

    # ------------------------------------------------------------------
    # vehicle_width — 车辆总宽度 [m]（含左右轮突出部分 + 侧悬）
    # ------------------------------------------------------------------
    # 用途：
    #   - 规划模块的 footprint 碰撞检测（车辆矩形包围盒的宽度）。
    #   - 静态绕障公式中的 W_ego。
    #   - 停车场/窄路可通行性判断。
    # 当前值 0.98 m：
    #   body box 宽 0.80 m，左右轮各突出约 0.09 m → 0.80+0.09*2≈0.98 m。
    #   增大 → 规划认为车辆更宽，绕障/窄路更保守，更容易因宽度不足放弃通行。
    #   减小 → 允许更窄间隙通过，更激进；但实车宽度不会变小，有碰撞风险。
    vehicle_width: 0.98

    # ------------------------------------------------------------------
    # vehicle_length — 车辆总长度 [m]（前后保险杠之间）
    # ------------------------------------------------------------------
    # 用途：
    #   - 规划模块的 footprint 碰撞检测（车辆矩形包围盒的长度）。
    #   - 停车点/目标点纵向定位。
    #   - 纵向 envelope 缓冲计算。
    # 当前值 1.20 m：
    #   body box 视觉模型长度为 1.20 m。
    #   实车物理长度约 1.30 m（wheel_base 0.82 + front_overhang 0.24 + rear_overhang 0.24）。
    #   增大 → 规划预留更多纵向空间，更保守。
    #   减小 → 更紧凑的纵向占用。
    vehicle_length: 1.20

    # ------------------------------------------------------------------
    # vehicle_height — 车辆总高度 [m]（地面到车顶）
    # ------------------------------------------------------------------
    # 用途：
    #   - 3D 碰撞检测（限高杆、桥洞等）。
    #   - vehicle.xacro 中 body box 的 Z 向尺寸。
    # 当前值 1.00 m：
    #   车体 box 高 1.00 m，box 底离地 0.16 m → box 顶离地 1.16 m。
    #   增大 → 更保守的限高约束。
    #   减小 → 忽略车顶以上障碍物。
    vehicle_height: 1.00

    # ==================================================================
    # 2. 底盘/悬架参数
    # ==================================================================

    # ------------------------------------------------------------------
    # wheel_base — 轴距 [m]（前轴到后轴的水平距离）
    # ------------------------------------------------------------------
    # 用途：
    #   - 运动学模型（自行车模型）的核心参数。
    #   - 转弯半径 = wheel_base / tan(max_steer_angle)。
    #   - vehicle.xacro 中前轮 x 坐标 = wheel_base。
    #   - 车体 box 中心 x 偏移 = wheel_base / 2。y
    # 当前值 0.82 m：
    #   实车标定值，比 wtb_car.xacro 中的 0.70 m 更宽。
    #   增大 → 转弯半径更大（同样方向盘角度下转弯更缓），纵向空间需求更大。
    #   减小 → 转弯更灵活，但值必须等于实车物理轴距。
    # ⚠ 此值必须精确匹配实车物理尺寸；错误会导致运动学模型失准、
    #   路径跟踪偏差和控制振荡。
    wheel_base: 0.82

    # ------------------------------------------------------------------
    # wheel_tread — 轮距 [m]（左右轮中心的横向距离）
    # ------------------------------------------------------------------
    # 用途：
    #   - vehicle.xacro 中车轮 y 坐标 = ±(wheel_tread / 2)。
    #   - 侧倾稳定性估算。
    # 当前值 0.86 m：
    #   左右轮中心间距 0.86 m，每侧车轮 y = ±0.43 m。
    #   增大 → 视觉上车轮更靠外，侧向稳定性更好。
    #   减小 → 车轮更靠近车身中心。
    wheel_tread: 0.86

    # ------------------------------------------------------------------
    # wheel_radius — 车轮半径 [m]
    # ------------------------------------------------------------------
    # 用途：
    #   - vehicle.xacro 中车轮圆柱体的半径。
    #   - 车轮中心 Z 坐标 = wheel_radius（相对 base_link 地面 Z=0）。
    # 当前值 0.20 m：
    #   车轮直径 0.40 m。
    #   增大 → 视觉上车轮更大，离地间隙更高。
    #   减小 → 车轮更小。
    wheel_radius: 0.20

    # ------------------------------------------------------------------
    # wheel_width — 车轮宽度（厚度）[m]
    # ------------------------------------------------------------------
    # 用途：
    #   - vehicle.xacro 中车轮圆柱体的长度。
    #   - 与 vehicle_width 结合构成含轮总宽。
    # 当前值 0.12 m。
    wheel_width: 0.12

    # ==================================================================
    # 3. 转向系统参数
    # ==================================================================

    # ------------------------------------------------------------------
    # max_steer_angle — 最大转向角 [rad]
    # ------------------------------------------------------------------
    # 用途：
    #   - 规划/控制模块的转向角上限。
    #   - 最小转弯半径 ≈ wheel_base / tan(max_steer_angle)。
    # 当前值 1.2109 rad ≈ 69.4°：
    #   对应的转弯半径 ≈ 0.82 / tan(1.2109) ≈ 0.31 m（极小的转弯半径，
    #   适合室内/狭窄场地）。
    #   增大 → 允许更急转弯，适合狭窄空间但可能导致侧翻。
    #   减小 → 转弯更平缓，转弯半径更大。
    # ⚠ 此值不应超过实车机械限位。
    max_steer_angle: 1.2109

    # ------------------------------------------------------------------
    # max_steer_angle_rate — 最大转向角速率 [rad/s]
    # ------------------------------------------------------------------
    # 用途：
    #   - 控制模块的转向角变化率上限（限幅）。
    #   - 防止方向盘/转向电机过快转动。
    # 当前值 2.0 rad/s ≈ 114.6°/s：
    #   转向从 0 到最大约需要 1.2109/2.0 ≈ 0.6 秒。
    #   增大 → 转向响应更快（路径跟踪更敏捷），但可能不舒适或超出舵机能力。
    #   减小 → 转向更平缓，但跟踪精度可能下降。
    max_steer_angle_rate: 2.0

    # ==================================================================
    # 4. 纵向动力学约束
    # ==================================================================

    # ------------------------------------------------------------------
    # max_velocity — 最大速度 [m/s]
    # ------------------------------------------------------------------
    # 用途：
    #   - 规划/控制模块的速度上限。
    #   - 目标速度生成时的硬约束。
    # 当前值 1.0 m/s = 3.6 km/h（步行速度）：
    #   适合室内/园区低速场景。
    #   增大 → 允许更高速度。
    #   减小 → 限速更严格。
    max_velocity: 1.0

    # ------------------------------------------------------------------
    # max_acceleration — 最大加速度 [m/s²]
    # ------------------------------------------------------------------
    # 用途：
    #   - 规划/控制模块的加速度上限（正加速）。
    # 当前值 1.0 m/s² ≈ 0.10 g：
    #   0→1.0 m/s 理论最短加速时间 ≈ 1.0 秒。
    #   增大 → 加速更快，但可能超出电机/电池能力。
    #   减小 → 起步更平缓。
    max_acceleration: 1.0

    # ------------------------------------------------------------------
    # min_acceleration — 最小加速度 [m/s²]（即最大减速度的负值）
    # ------------------------------------------------------------------
    # 用途：
    #   - 规划/控制模块的减速度下限（负值表示刹车）。
    # 当前值 -1.0 m/s² ≈ -0.10 g：
    #   1.0 m/s→0 理论最短刹车距离 ≈ 1.0²/(2×1.0) = 0.50 m。
    #   越负（绝对值越大）→ 紧急制动能力更强，但乘客不适且可能超出实际制动能力。
    #   越接近 0 → 只能缓慢减速。
    # ⚠ 此值必须 ≤ 实车可稳定达到的最大减速度。
    min_acceleration: -1.0

    # ==================================================================
    # 5. 质心位置参数
    # ==================================================================

    # ------------------------------------------------------------------
    # cog_to_rear_axle — 质心到后轴的距离 [m]（沿 +X 方向）
    # ------------------------------------------------------------------
    # 用途：
    #   - 控制模块的前馈/反馈计算。
    #   - 质心纵向位置影响转向动力学。
    # 当前值 0.41 m = wheel_base / 2：
    #   质心位于前后轴正中间（前后轴重量分布均匀）。
    #   增大 → 质心更靠前（前轮载荷更大，不足转向倾向增加）。
    #   减小 → 质心更靠后（后轮载荷更大，过度转向倾向增加）。
    cog_to_rear_axle: 0.41

    # ------------------------------------------------------------------
    # cog_to_front_axle — 质心到前轴的距离 [m]（沿 -X 方向）
    # ------------------------------------------------------------------
    # 用途：
    #   - 与 cog_to_rear_axle 共同定义质心纵向位置。
    #   - 需满足 cog_to_rear_axle + cog_to_front_axle = wheel_base。
    # 当前值 0.41 m。
    cog_to_front_axle: 0.41

    # ==================================================================
    # 6. 前后/左右悬伸参数（overhang）
    # ==================================================================
    # overhang 定义车轴到车身最外缘的距离，用于精确 footprint 计算：
    #
    #  物理总长 ≈ rear_overhang + wheel_base + front_overhang
    #           ≈ 0.24 + 0.82 + 0.24 = 1.30 m
    #  物理总宽 ≈ vehicle_width = 0.98 m（含侧悬 left/right_overhang）
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # front_overhang — 前悬 [m]（前轴中心到前保险杠最前端的水平距离）
    # ------------------------------------------------------------------
    # 用途：
    #   - 前方障碍物 envelope 纵向缓冲 D_front 计算。
    #   - 规划模块判断车头会不会扫到障碍物。
    # 当前值 0.24 m。
    front_overhang: 0.24

    # ------------------------------------------------------------------
    # rear_overhang — 后悬 [m]（后轴中心到后保险杠最后端的水平距离）
    # ------------------------------------------------------------------
    # 用途：
    #   - 后方障碍物 envelope 纵向缓冲 D_rear 计算。
    # 当前值 0.24 m。
    rear_overhang: 0.24

    # ------------------------------------------------------------------
    # left_overhang — 左侧悬伸 [m]（左轮最外侧到车身最左侧的距离）
    # ------------------------------------------------------------------
    # 用途：
    #   - 左侧障碍物的横向间隙计算。
    # 当前值 0.06 m。
    left_overhang: 0.06

    # ------------------------------------------------------------------
    # right_overhang — 右侧悬伸 [m]（右轮最外侧到车身最右侧的距离）
    # ------------------------------------------------------------------
    # 用途：
    #   - 右侧障碍物的横向间隙计算。
    # 当前值 0.06 m。
    right_overhang: 0.06
