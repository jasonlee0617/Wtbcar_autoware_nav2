# ==============================================================================
# trajectory_checker 参数配置
# ==============================================================================
# 本文件配置轨迹检查器（trajectory_checker）的各项验证阈值。
# 轨迹检查器是规划验证器（planning_validator）的子模块，用于在规划模块输出轨迹后，
# 对轨迹的物理可行性、几何合理性和时序一致性进行多维度校验。
# 如果任一检查项未通过，规划验证器将拒绝该轨迹并触发相应的诊断/错误处理逻辑。
#
# 检查项概览：
#   - 几何类：interval（点间距）、curvature（曲率）、relative_angle（相对角度）
#   - 运动学类：lateral_accel（横向加速度）、min/max_lon_accel（纵向加速度）、
#               lateral_jerk（横向加加速度）、steering（转向角）、steering_rate（转向速率）
#   - 偏差类：distance_deviation（距离偏差）、lon_distance_deviation（纵向距离偏差）、
#             velocity_deviation（速度偏差）、yaw_deviation（航向偏差）
#   - 综合类：forward_trajectory_length（前向轨迹长度/刹停距离）、
#             trajectory_shift（轨迹跳变检测）
# ==============================================================================

/**:
  ros__parameters:
    trajectory_checker:

      # --------------------------------------------------------------------------
      # interval - 轨迹点间距检查
      # 验证相邻轨迹点之间的间距是否在合理范围内。
      # 点间距过大会导致插值精度下降，影响后续控制模块的跟踪性能。
      # --------------------------------------------------------------------------
      interval:
        enable: true           # 是否启用该检查项
        threshold: 100.0       # [m] 允许的最大点间距阈值

      # --------------------------------------------------------------------------
      # curvature - 轨迹曲率检查
      # 验证轨迹的最大曲率是否在车辆可执行的范围内。
      # 曲率过大会导致车辆无法跟踪轨迹（受限于最小转弯半径）。
      # --------------------------------------------------------------------------
      curvature:
        enable: true           # 是否启用该检查项
        threshold: 1.0         # [1/m] 允许的最大曲率

      # --------------------------------------------------------------------------
      # relative_angle - 相邻轨迹点相对角度检查
      # 验证相邻轨迹点之间的航向角变化是否在合理范围内。
      # 角度变化过大会导致轨迹不平滑，车辆无法平稳跟踪。
      # --------------------------------------------------------------------------
      relative_angle:
        enable: true           # 是否启用该检查项
        threshold: 2.0         # [rad] 允许的最大相对角度（≈115度）

      # --------------------------------------------------------------------------
      # lateral_accel - 横向加速度检查
      # 验证轨迹所需的横向加速度是否在车辆物理极限内。
      # 横向加速度由曲率和速度共同决定：a_lat = v^2 * curvature
      # 超出阈值意味着车辆可能侧滑或翻车。
      # --------------------------------------------------------------------------
      lateral_accel:
        enable: true           # 是否启用该检查项
        threshold: 9.8         # [m/s²] 允许的最大横向加速度（≈1.0g）

      # --------------------------------------------------------------------------
      # min_lon_accel - 最小纵向加速度检查（最大减速度）
      # 验证轨迹所需的最大减速度是否在车辆制动能力范围内。
      # 负值表示减速度，绝对值过大会导致制动不足或乘客不适。
      # --------------------------------------------------------------------------
      min_lon_accel:
        enable: true           # 是否启用该检查项
        threshold: -9.8        # [m/s²] 允许的最小纵向加速度（负值=减速度，≈-1.0g）

      # --------------------------------------------------------------------------
      # max_lon_accel - 最大纵向加速度检查
      # 验证轨迹所需的最大加速度是否在车辆动力系统能力范围内。
      # 正值表示加速，过大会导致动力不足或轮胎打滑。
      # --------------------------------------------------------------------------
      max_lon_accel:
        enable: true           # 是否启用该检查项
        threshold: 9.8         # [m/s²] 允许的最大纵向加速度（≈1.0g）

      # --------------------------------------------------------------------------
      # lateral_jerk - 横向加加速度（Jerk）检查
      # 验证横向加速度的变化率是否在舒适性和稳定性范围内。
      # Jerk 是加速度对时间的导数，反映了加速度变化的剧烈程度。
      # 横向 Jerk 过大会导致乘客侧向不适和轨迹跟踪不稳定。
      # --------------------------------------------------------------------------
      lateral_jerk:
        enable: true           # 是否启用该检查项
        threshold: 7.0         # [m/s³] 允许的最大横向 Jerk

      # --------------------------------------------------------------------------
      # steering - 转向角检查
      # 验证轨迹所需的转向角（前轮转角）是否在车辆转向机构允许范围内。
      # 转向角由曲率、轴距等车辆参数反算得出。
      # --------------------------------------------------------------------------
      steering:
        enable: true           # 是否启用该检查项
        threshold: 1.414       # [rad] 允许的最大转向角（≈81度）

      # --------------------------------------------------------------------------
      # steering_rate - 转向速率检查
      # 验证轨迹所需的转向角变化率是否在转向执行机构的能力范围内。
      # 转向速率过大会导致转向电机无法跟上指令，产生跟踪误差。
      # --------------------------------------------------------------------------
      steering_rate:
        enable: true           # 是否启用该检查项
        threshold: 10.0        # [rad/s] 允许的最大转向速率

      # --------------------------------------------------------------------------
      # distance_deviation - 距离偏差检查
      # 验证当前规划轨迹与上一帧轨迹在空间位置上的整体偏差。
      # 用于检测规划结果是否发生了异常的轨迹跳变。
      # 偏差过大可能导致控制模块产生不连续的指令。
      # --------------------------------------------------------------------------
      distance_deviation:
        enable: true           # 是否启用该检查项
        threshold: 100.0       # [m] 允许的最大距离偏差

      # --------------------------------------------------------------------------
      # lon_distance_deviation - 纵向距离偏差检查
      # 验证当前轨迹与上一帧轨迹在纵向（沿轨迹方向）上的位置偏差。
      # 与 distance_deviation 相比，本检查项仅关注纵向分量，
      # 对规划周期之间的纵向跳变更为敏感。
      # --------------------------------------------------------------------------
      lon_distance_deviation:
        enable: true           # 是否启用该检查项
        threshold: 1.0         # [m] 允许的最大纵向距离偏差

      # --------------------------------------------------------------------------
      # velocity_deviation - 速度偏差检查
      # 验证当前轨迹与上一帧轨迹在速度剖面（velocity profile）上的偏差。
      # 速度突变会导致加速度指令超出车辆能力或乘客感到不适。
      # --------------------------------------------------------------------------
      velocity_deviation:
        enable: true           # 是否启用该检查项
        threshold: 100.0       # [m/s] 允许的最大速度偏差

      # --------------------------------------------------------------------------
      # yaw_deviation - 航向角偏差检查
      # 验证当前轨迹与上一帧轨迹在对应点上的航向角偏差。
      # 航向角突变会导致车辆姿态剧烈变化，影响稳定性和舒适性。
      # 注意：为避免因轨迹整体旋转引起的误报，仅当最近点的航向角
      #       在前后帧之间跳变超过 th_trajectory_yaw_shift 时才触发检查。
      # --------------------------------------------------------------------------
      yaw_deviation:
        enable: true           # 是否启用该检查项
        threshold: 1.5708      # [rad] 允许的最大航向角偏差（=90度）
        th_trajectory_yaw_shift: 0.1  # [rad] 轨迹航向偏移阈值——仅当前后帧最近点的航向角跳变超过此值时，才进行 yaw_deviation 检查

      # --------------------------------------------------------------------------
      # forward_trajectory_length - 前向轨迹长度（刹停距离）检查
      # 验证输出轨迹的前向长度是否足以让车辆在当前速度下安全刹停。
      # 根据当前车速和加速度参数计算所需的最短轨迹长度，
      # 如果轨迹长度不足，可能在紧急情况下无法安全停车。
      #
      # 计算公式：required_length = v^2 / (2 * |acceleration|) + margin
      # 其中 v 为当前车速，acceleration 为设定的减速度，margin 为安全余量。
      # --------------------------------------------------------------------------
      forward_trajectory_length:
        enable: true           # 是否启用该检查项
        acceleration: -3.0     # [m/s²] 用于计算刹停距离的减速度（负值）
        margin: 2.0            # [m] 安全距离余量，确保轨迹比理论刹停距离更长

      # --------------------------------------------------------------------------
      # trajectory_shift - 轨迹跳变检查
      # 检测当前规划周期输出的轨迹相对于上一周期的轨迹是否发生了异常跳变。
      # 轨迹跳变通常由规划算法不稳定、传感器噪声或环境突变引起。
      # 本检查分别从横向、前向和后向三个维度进行监控。
      #
      # handling_type 决定检查失败时的处理策略：
      #   0 = 仅输出日志（LOG）
      #   1 = 输出警告（WARN）
      #   2 = 输出错误诊断（ERROR_DIAG）
      #   3 = 紧急停车（EMERGENCY）
      # 具体定义参见 common planning validator 参数文件。
      # --------------------------------------------------------------------------
      trajectory_shift:
        enable: true           # 是否启用该检查项
        lat_shift_th: 0.5      # [m] 横向跳变阈值——轨迹在垂直于行进方向上的最大允许偏移
        forward_shift_th: 1.0  # [m] 前向跳变阈值——轨迹在行进方向上的最大允许前移
        backward_shift_th: 0.1 # [m] 后向跳变阈值——轨迹在行进反方向上的最大允许后移
        handling_type: 2       # 处理类型：2 = 输出错误诊断（ERROR_DIAG）
        override_error_diag: false  # 是否覆盖错误诊断级别（false = 使用默认诊断行为）
