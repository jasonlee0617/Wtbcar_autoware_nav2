/**:
  ros__parameters:
    # ==========================================================================
    # 可行驶区域扩展模块 (drivable_area_expansion)
    #
    # 功能概述：
    #   在静态/动态规划中对参考路径两侧的可行驶区域进行扩展，为规划模块
    #   （尤其是 static_obstacle_avoidance）提供更大的合法横向空间。
    #   扩展后的可行驶边界直接影响静态绕障模块的 L_bound 计算：
    #     L_bound ~= D_center_to_bound - W_ego/2 - M_bound
    #   扩展量越大 → L_bound 越大 → 绕障横向空间越充裕。
    #
    # 与 static_obstacle_avoidance 的关系：
    #   本模块的输出（扩展后的 drivable area）是 static_obstacle_avoidance
    #   中可行驶边界 (drivable bound) 的上游输入。若本模块过于保守，即使
    #   static_obstacle_avoidance 的 soft/hard_margin 调得再好，L_bound
    #   也不足以容纳避障偏移量，最终导致绕障失败→停车。
    #
    # 参数调优总览：
    #   增大扩展量 → 更多横向空间（更有利于绕障成功），但可能压线/越界。
    #   减小扩展量 → 更严格遵守车道/道路边界（更保守），绕障空间受限。
    # ==========================================================================
    # 官方默认值来源：autowarefoundation/autoware_launch 的 main 分支原始参数文件，
    # 核对日期：2026-07-10。本文件中的现有调参值保持不变。
    # ==========================================================================

    # ==========================================================================
    # 1. 静态扩展参数 (Static expansion)
    #
    # 功能：
    #   在全部路径点对参考路径两侧的可行驶区域做一个固定的、与曲率和障碍物
    #   无关的横向偏移。这是应用在整条路径上的粗粒度扩展。
    #
    # 与 static_obstacle_avoidance 的关系：
    #   静态扩展的偏移量直接增大 D_bound（路径中心到可行驶边界的距离），
    #   从而增大 L_bound，为绕障提供更大的横向空间。
    #
    # 公式（static_obstacle_avoidance 中横向空间判断）：
    #   L_bound ~= D_center_to_bound - W_ego/2 - M_bound
    #   其中 D_center_to_bound 已包含本模块的静态扩展偏移量。
    # ==========================================================================

    # --------------------------------------------------------------------------
    # drivable_area_right_bound_offset — 右侧可行驶区域静态偏移量 [m]
    # --------------------------------------------------------------------------
    # 正值 → 向右侧（+Y 方向）扩展可行驶区域，增加右侧可用横向空间。
    # 负值 → 向内侧收缩，限制右侧空间。
    # 当前值 1.0 m：
    #   W_ego=0.98m，hard_drivable_bound_margin=0.1m，
    #   原始右侧 L_bound 仅约 (lane_width/2) - 0.49 - 0.10。
    #   额外右扩 1.0m 可为 L_shift（最大右绕 2.0m）提供充裕的右侧绕行空间。
    # ⚠ 此值必须 ≤ 实际右侧可用物理空间（如车道宽度+路肩），否则
    #   可行驶区域会画到不可行驶的物理障碍/边界外。
    # official default (autoware_launch/main): 0.0
    drivable_area_right_bound_offset: 1.0

    # --------------------------------------------------------------------------
    # drivable_area_left_bound_offset — 左侧可行驶区域静态偏移量 [m]
    # --------------------------------------------------------------------------
    # 正值 → 向左侧（-Y 方向）扩展可行驶区域，增加左侧可用横向空间。
    # 当前值 1.5 m（>右偏 1.0 m）：
    #   配合 max_left_shift_length=4.0 m（>max_right=2.0 m），
    #   让左侧有更大的绕行空间，适合需要借用对向车道绕行的场景。
    # official default (autoware_launch/main): 0.0
    drivable_area_left_bound_offset: 1.5

    # --------------------------------------------------------------------------
    # drivable_area_types_to_skip — 扩展时跳过的边界类型列表
    # --------------------------------------------------------------------------
    # 当可行驶区域向外扩展时，遇到列表中类型的线串时停止扩展，
    # 防止可行驶区域越过道路边界、路缘石等物理不可跨越的界限。
    # 当前值 [road_border]：
    #   只跳过 road_border（道路边界），允许越过其他类型（如 lanelet 车道线）。
    #   如需更保守，可添加 'curbstone' 等。
    #   设为空列表 [] → 不跳过任何边界，可行驶区域可以无限外扩（危险）。
    # official default (autoware_launch/main): [road_border]
    drivable_area_types_to_skip: [road_border]

    # ==========================================================================
    # 2. 动态扩展参数 (Dynamic expansion by using the path curvature)
    #
    # 功能：
    #   当车辆行驶在弯道上时，车身投影（尤其是前后悬）会比直道更靠外侧，
    #   需要更大的侧向空间。本模块根据路径曲率动态计算需要额外扩展的量：
    #
    #     expansion ≈ |curvature| * (wheelbase + extra_wheelbase) * arc_length
    #                + vehicle特定的前/后悬和宽度影响
    #
    #   曲率越大（弯越急）、速度越高 → 需要的扩展量越大。
    #
    # 与 static_obstacle_avoidance 的关系：
    #   弯道上 L_bound 偏小是常见导致绕障失败的原因。动态扩展可以在弯道
    #   处自动增大可行驶区域，让 static_obstacle_avoidance 在弯道上也有
    #   足够的横向空间生成绕障路径。
    # ==========================================================================
    dynamic_expansion:
      # 是否启用动态扩展
      #   true  → 根据路径曲率动态扩展可行驶区域（推荐开启）。
      #   false → 仅使用静态扩展（弯道绕障空间可能不足）。
      # official default (autoware_launch/main): true
      enabled: true

      # 是否输出运行时间信息
      #   true  → 控制台打印每次扩展计算的耗时（调试用）。
      #   false → 不打印。
      print_runtime: false

      # ------------------------------------------------------------------------
      # max_expansion_distance — 动态扩展的上限 [m]
      # ------------------------------------------------------------------------
      # 限制单次动态扩展的最大距离，防止极端曲率下过度扩展。
      # 当前值 0.0 = 不限制：
      #   WTB 小车轴距仅 0.82 m、速度仅 1.0 m/s，弯道扩展量本身不大，
      #   无需额外限制。若在高曲率路径上出现过度扩展（可行驶区域远超道路），
      #   可设置一个合理上限（如 2.0~3.0 m）。
      # 值越小 → 最大扩展量越小，越保守。
      # official default (autoware_launch/main): 0.0
      max_expansion_distance: 0.0

      # ------------------------------------------------------------------------
      # min_bound_interval — 边界点最小间距 [m]
      # ------------------------------------------------------------------------
      # 扩展前对路径点的重采样间距。紧密的点能更精确反映曲率变化。
      # 当前值 1.0 m：
      #   对于 WTB 低速场景（max 1.0 m/s），1m 间距足够分辨弯道曲率。
      #   增大 → 计算更快但可能漏掉短距离内的曲率变化。
      #   减小 → 更精确但计算量增大。
      min_bound_interval: 1.0

      # ------------------------------------------------------------------------
      # 平滑参数 — 抑制扩展量的高频抖动
      # ------------------------------------------------------------------------
      smoothing:
        # ----------------------------------------------------------------------
        # curvature_average_window — 曲率滑动平均窗口
        # ----------------------------------------------------------------------
        # 对路径曲率做移动平均的窗口大小。曲率噪声通常来自 lanelet 地图
        # 的离散采样或路径生成器的微小抖动。
        # 当前值 3：
        #   对前后各 1 个点的曲率取平均，适合 WTB 低速场景。
        #   增大 → 曲率更平滑，但响应真实曲率变化更滞后，弯道入口扩展不足。
        #   减小 → 对曲率变化更敏感，但噪声可能导致扩展量频繁波动。
        curvature_average_window: 3

        # ----------------------------------------------------------------------
        # max_bound_rate — 边界横向距离沿弧长的最大变化率 [m/m]
        # ----------------------------------------------------------------------
        # 限制相邻两点之间的扩展量差异 / 弧长，防止可行驶边界出现折角。
        # 当前值 1.0 m/m：
        #   每前进 1 m，扩展量最多变化 ±1 m。对于 WTB 低速场景足够平滑。
        #   增大 → 允许边界更急剧变化，可能导致 path jitter。
        #   减小 → 边界过渡更平滑，但可能跟不上实际需要的扩展量。
        max_bound_rate: 1.0

        # ----------------------------------------------------------------------
        # arc_length_range — 初始过渡弧长 [m]
        # ----------------------------------------------------------------------
        # 在路径起点（或扩展量突变处）的过渡长度。扩展量在此弧长范围内
        # 从 0 线性增加到目标值，避免突然跃变。
        # 当前值 2.0 m：
        #   在 2m 弧长内实现平滑过渡。适合低速场景（1 m/s 需 2s 过渡）。
        #   增大 → 过渡更平缓但响应更慢（车已进弯但扩展还没到位）。
        #   减小 → 进入状态更快但可能产生突变的驱动力请求。
        arc_length_range: 2.0

      # ------------------------------------------------------------------------
      # 自车尺寸修正参数 — 为弯道扩展补充额外的车辆投影余量
      #
      # 公式近似：
      #   弯道中，车头外侧偏移 ≈ (front_overhang + extra_front_overhang)
      #                       * sin(|弯曲导致的航向偏差|)
      #   这些 extra_* 参数在已从 vehicle_info.param.yaml 获取轮距/前悬
      #   等标称值的基础上再叠加，用于补偿载荷、铰接、或建模误差。
      # ------------------------------------------------------------------------
      ego:
        # 额外增加的轴距 [m]。增大 → 弯道中外侧扩展更多（更保守）。
        extra_wheelbase: 0.0

        # 额外增加的前悬长度 [m]。增大 → 车头外侧扫过的空间更大，扩展更多。
        extra_front_overhang: 0.0

        # 额外增加的车辆宽度 [m]。增大 → 侧面投影更宽，扩展更多。
        extra_width: 0.0

      # ------------------------------------------------------------------------
      # 对象排除参数 — 当扩展的可行驶区域与障碍物冲突时的处理
      #
      # 与 static_obstacle_avoidance 的关系：
      #   如果 exclude_static=true 且 WTB 感知输出的静态障碍物类型为 unknown，
      #   则按本模块 th_stopped_object_velocity 判为静止的 unknown 障碍物
      #   正上方不会画可行驶区域，进一步避免绕障规划在障碍物上方生成路径。
      # ------------------------------------------------------------------------
      object_exclusion:
        # 是否在静态物体上排除可行驶区域
        #   true  → 静态障碍物（如椅子/路障）正上方的区域不纳入可行驶区域。
        #   false → 允许规划路径经过静态物体上方（依赖 static_obstacle_avoidance
        #            的 soft/hard_margin 和 envelope 做横向避让）。
        # official default (autoware_launch/main): false
        exclude_static: false

        # 是否在动态物体预测路径上排除可行驶区域
        #   true  → 动态障碍物未来轨迹上的区域被排除。
        #   false → 不排除。
        exclude_dynamic: false

        # th_stopped_object_velocity — 判断静态物体的速度阈值 [m/s]
        #   当前值 1.0 m/s（= 3.6 km/h）：
        #     速度 < 1.0 m/s 的目标视为静态（与 unknown.th_moving_speed=1.0 对齐）。
        #     增大 → 更多慢速移动的目标被判为静态，排除更多区域。
        #     减小 → 只有极慢/完全停止的目标才触发排除。
        #   ⚠ 此阈值应与 static_obstacle_avoidance 中各类型的 th_moving_speed
        #     协调一致，否则可能出现"这里判断是静态排除了，绕障却认为目标是动态不绕"的矛盾。
        th_stopped_object_velocity: 1.0

        # 物体 footprint 周围的安全裕度 [m]
        #   在物体检测框四周增加固定的安全距离。当 exclude_static=true 时，
        #   被排除的区域 = 物体检测框 + safety_margin 各方向。
        # 当前值 全部 0.75 m：
        #   在障碍物四周保留 0.75 m 缓冲区。对于 unknown 类型的椅子等小物体，
        #   结果安全区约 0.50+0.75=1.25 m（半宽+margin）。
        safety_margin:
          front: 0.75
          rear: 0.75
          left: 0.75
          right: 0.75

      # ------------------------------------------------------------------------
      # 路径预处理参数 — 投影计算前的路径优化
      # ------------------------------------------------------------------------
      path_preprocessing:
        # max_arc_length — 投影自车轮廓的最大弧长 [m]
        #   防止在超长路径上计算量过大。当前值 100.0 m 对 WTB 场景绰绰有余。
        max_arc_length: 100.0

        # resample_interval — 路径重采样间距 [m]
        #   当前值 2.0 m（> min_bound_interval=1.0 m）：
        #     先用 2.0 m 重采样减少计算量，再用 1.0 m 保证边界精度。
        #     增大 → 计算更快但投影精度降低。
        resample_interval: 2.0

        # reuse_max_deviation — 路径重用偏差阈值 [m]
        #   如果新路径与上次路径的偏差 < 此阈值，则重用上次计算的曲率/扩展结果。
        #   当前值 0.5 m：
        #     对于 WTB（max 1.0 m/s），路径变化缓慢，0.5m 重用阈值可大幅减少
        #     重复计算。增大 → 更激进的重用（更快但可能错过路径微调）。
        reuse_max_deviation: 0.5

      # ------------------------------------------------------------------------
      # 避免跨越的线串类型 — 定义扩展的硬边界
      #
      # 可行驶区域最多扩展到这些类型的线串为止，不可越过。
      # 当前配置 [road_border, curbstone]：
      #   道路边界和路缘石均为物理不可跨越的边界，必须在此止步。
      # ------------------------------------------------------------------------
      avoid_linestring:
        types:
          - road_border
          - curbstone
        # 与这些线串之间保持的最小缓冲距离 [m]
        #   当前值 0.0 m → 可行驶区域可紧贴 road_border/curbstone。
        #   增大 → 在边界前保留更多安全间隙（更保守）。
        distance: 0.0