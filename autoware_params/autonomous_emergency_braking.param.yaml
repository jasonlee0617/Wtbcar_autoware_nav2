# ============================================================================
# 自动紧急制动 (AEB — Autonomous Emergency Braking) 参数
# ============================================================================
# 功能：作为控制层的最后一道安全防线，AEB 独立于规划模块，直接基于传感器数据
#       （点云 + 预测轨迹/IMU路径）检测碰撞风险，并在必要时触发紧急制动。
#
# 工作流程：
#   1. 生成自车预测路径（基于规划轨迹 或 IMU 推算）
#   2. 裁剪点云到自车路径附近区域
#   3. 对点云进行体素下采样和欧几里得聚类
#   4. 对每个聚类（障碍物）进行 RSS 碰撞距离检查
#   5. 若存在碰撞风险，发布紧急制动指令
# ============================================================================

/**:
  ros__parameters:
    # ==========================================================================
    # 1. 自车路径计算 (Ego Path Calculation)
    #    AEB 用自车预测路径来裁剪点云搜索范围。有两种路径来源可选：
    #    - predicted_trajectory: 规划模块输出的预测轨迹（MPC 预测范围）
    #    - IMU path: 基于当前车速和转向角推算的路径（更短、更即时）
    #    两种路径可以同时使用（取较保守者），也可单独使用
    # ==========================================================================

    # ---- 是否使用规划模块的预测轨迹 ----
    # 来自 /control/trajectory_follower/predicted_trajectory
    use_predicted_trajectory: true

    # ---- 是否使用基于 IMU/车速推算的路径 ----
    # 不依赖规划模块，完全基于当前运动状态推算，是规划失效时的后备方案
    use_imu_path: true

    # ---- 是否限制 IMU 路径的横向偏移 ----
    # IMU 路径在长距离上可能发散，开启后限制其横向偏移不超过阈值
    limit_imu_path_lat_dev: false

    # ---- 是否限制 IMU 路径的长度 ----
    # 开启后 IMU 路径长度不超过 max_generated_imu_path_length
    limit_imu_path_length: true

    # ---- 是否使用点云数据进行碰撞检测 ----
    # 关闭后仅使用检测框（predicted objects），不处理原始点云
    use_pointcloud_data: true

    # ---- 是否使用预测物体数据 ----
    # 来自感知模块的检测+预测物体（带预测轨迹的检测框）
    use_predicted_object_data: true
    # use_predicted_object_data: false

    # ---- 是否使用物体速度计算 ----
    # 基于点云聚类的时间序列关联来估计障碍物速度（而非仅依赖检测框速度）
    use_object_velocity_calculation: true

    # ---- 是否检查 Autoware 状态 ----
    # 仅在 AUTONOMOUS 模式下才触发 AEB，手动模式不干预
    check_autoware_state: true

    # ---- IMU 路径横向偏移阈值 [m] ----
    # 当 limit_imu_path_lat_dev=true 时，IMU 路径横向偏移上限
    imu_path_lat_dev_threshold: 1.75

    # ---- IMU 路径生成参数 ----
    # 生成的最短 IMU 路径长度 [m]（低于此时不触发 AEB，避免低速无意义制动）
    min_generated_imu_path_length: 0.5
    # 生成的最长 IMU 路径长度 [m]（限制搜索范围，减少点云计算量）
    max_generated_imu_path_length: 10.0

    # ---- IMU 路径预测时间参数 ----
    # 基于当前速度和横摆角速度推算路径的时间范围 [s]
    # 时速 36 km/h (10 m/s) × 1.5s = 15m 预测距离
    imu_prediction_time_horizon: 1.5
    # IMU 路径上相邻点之间的时间间隔 [s]
    imu_prediction_time_interval: 0.1

    # ---- MPC 预测时间参数 ----
    # 使用规划轨迹进行碰撞预测的时间范围 [s]
    # 比 IMU 路径更长（4.5s vs 1.5s），因为规划轨迹由 MPC 控制器生成
    mpc_prediction_time_horizon: 4.5
    # MPC 轨迹上相邻点之间的时间间隔 [s]
    mpc_prediction_time_interval: 0.3

    # ==========================================================================
    # 2. 调试选项 (Debug)
    # ==========================================================================

    # 是否发布用于调试的点云（经过裁剪和下采样后的点云）
    publish_debug_pointcloud: false
    # 是否发布调试标记（障碍物聚类、路径、碰撞检测结果的可视化 marker）
    publish_debug_markers: true

    # ==========================================================================
    # 3. 点云分割与裁剪 (Point Cloud Partitioning & Cropping)
    #    目的：将原始大范围点云缩减到仅包含自车路径附近的点，减少计算量
    # ==========================================================================

    # ---- 检测高度范围 ----
    # 从地面起算的最小检测高度 [m]（0.0 = 地面，过滤地面以下的噪点）
    detection_range_min_height: 0.0
    # 自车顶部以上的额外检测高度裕度 [m]
    # 0.0 = 仅检测不超过自车高度的障碍物
    detection_range_max_height_margin: 0.0

    # ---- 体素网格下采样 (Voxel Grid Downsampling) ----
    # 将点云按体素网格聚合，每格保留一个代表点，大幅减少点数
    # X 方向（纵向）体素尺寸 [m]。0.1 = 每 10cm 一个格
    voxel_grid_x: 0.1
    # Y 方向（横向）体素尺寸 [m]
    voxel_grid_y: 0.1
    # Z 方向（高度）体素尺寸 [m]
    # 0.5 = 高度方向粗采样（障碍物只要在同一高度范围内就被合并）
    # voxel_grid_z: 0.5
    voxel_grid_z: 0.1   # 备选：更精细的高度采样

    # ---- 点云裁剪 (沿自车路径裁剪) ----
    # 在自车 footprint（车体投影）宽度基础上的额外扩展 [m]
    # 0.0 = 仅裁剪 footprint 宽度内的点；负值 = 收窄
    # expand_width: 0.0
    expand_width: -0.2   # 备选：收窄裁剪范围（更保守，可能漏检）

    # 路径 footprint 的额外纵向裕度 [m]
    # 在自车前后各扩展此距离，确保靠近但未重合的障碍物也被检测
    path_footprint_extra_margin: 1.0

    # 速度计算时的扩展裕度 [m]
    # 在时间序列关联时扩大搜索范围，帮助匹配快速移动的障碍物
    speed_calculation_expansion_margin: 0.7

    # ==========================================================================
    # 4. 点云聚类 (Point Cloud Clustering)
    #    将下采样后的点云按欧几里得距离聚类成独立的障碍物
    # ==========================================================================

    # ---- 聚类容差 [m] ----
    # 欧几里得聚类算法中，两点之间被视为同一聚类的最大距离
    # 值越大，越远的点会被合并到同一个聚类中
    cluster_tolerance: 0.15

    # ---- 聚类最小高度 [m] ----
    # 障碍物聚类在 Z 方向的最小跨度。低于此值的扁平物体（如地面噪点）被过滤
    cluster_minimum_height: 0.01
    # cluster_minimum_height: 0.1   # 备选：更宽松的过滤

    # ---- 聚类尺寸阈值 ----
    # 最小聚类点数。少于 5 个点的聚类被视为噪声丢弃
    minimum_cluster_size: 5
    # minimum_cluster_size: 10     # 备选：更严格
    # 最大聚类点数。超过此值的聚类可能是大范围地面/建筑物，不做处理
    maximum_cluster_size: 10000

    # ==========================================================================
    # 5. RSS 碰撞距离检查 (RSS Distance Collision Check)
    #    RSS = Responsibility Sensitive Safety（责任敏感安全模型）
    #    计算"在给定自车和障碍物减速度下，是否能在碰撞前停下"
    #
    #    RSS 安全距离公式（纵向）：
    #      d_safe = [v_ego * t_response + 0.5 * v_ego^2 / |a_ego_min|]
    #             - [0.5 * v_obj^2 / |a_obj_min|]
    #    当自车与障碍物距离 < d_safe 时，触发紧急制动
    # ==========================================================================

    # ---- 纵向偏移裕度 [m] ----
    # 在 RSS 计算的安全距离基础上额外增加的缓冲区
    # 例如：对象在轨迹前方 5m、RSS 安全距离 3m → 加上 1m 裕度后实际比较 4m
    longitudinal_offset_margin: 1.0

    # ---- 自车反应时间 [s] ----
    # 从检测到危险到制动生效的总延迟（传感器延迟 + 执行器延迟 + 安全冗余）
    # RSS 公式中的 t_response：v_ego * t_response 是反应距离
    t_response: 1.0

    # ---- 自车最小加速度（即最大减速度）[m/s^2] ----
    # RSS 假设自车能以 |a_ego_min| 的减速度紧急制动
    # -3.0 = 假设自车可达到 3.0 m/s^2 的减速度
    # 值越负（绝对值越大）→ 假设制动越强 → RSS 安全距离越短 → 触发越晚 → 越激进
    # 值越正（绝对值越小）→ 假设制动越弱 → RSS 安全距离越长 → 触发越早 → 越保守
    a_ego_min: -3.0

    # ---- 障碍物最小加速度（即最大减速度）[m/s^2] ----
    # RSS 假设前方障碍物最多能以 |a_obj_min| 的减速度刹车
    # -1.0 = 假设前方车辆最多减速 1.0 m/s^2（较小的值，较保守）
    # 值越负 → 假设前车能急刹车 → 安全距离越短 → 越激进
    a_obj_min: -1.0

    # ---- 碰撞保持时间 [s] ----
    # AEB 触发后，即使碰撞风险消失，至少保持制动的时间
    # 防止在风险临界状态下来回切换制动/释放
    collision_keeping_sec: 3.0

    # ---- 历史障碍物保持时间 [s] ----
    # 某个障碍物从视野中消失后，继续将其视为碰撞候选的时间
    # 防止因传感器短暂遮挡导致的障碍物"消失-重现"振荡
    previous_obstacle_keep_time: 1.0

    # ---- AEB 处理频率 [Hz] ----
    # AEB 模块的运行频率。100Hz = 每 10ms 检查一次碰撞风险
    # 高频率确保快速响应，减少延迟
    aeb_hz: 100.0
    # aeb_hz: 10.0   # 备选：较低频率（减少 CPU 占用，但增加响应延迟）
