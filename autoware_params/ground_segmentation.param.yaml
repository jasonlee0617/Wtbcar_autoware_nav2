/**:
  ros__parameters:
    # ============================================================================
    # 额外的激光雷达话题列表，用于多激光雷达融合
    #   当使用多个激光雷达时，在此列出额外的话题名称
    #   为空表示仅使用主激光雷达
    # ============================================================================
    additional_lidars: []
    # RANSAC 地面分割的输入话题列表
    #   为空表示不启用 RANSAC 分割
    ransac_input_topics: []

    # ============================================================================
    # 通用裁剪框滤波器参数 (CropBoxFilter)
    #   作用：裁剪点云范围，去除感兴趣区域外的点，减少后续计算量
    #   原理：定义三维空间中的一个长方体区域，保留框内点 (negative=False)
    #   NOTE: min_z / max_z 由 margin_min_z / margin_max_z 作为车辆坐标系下的
    #         偏移量间接指定，非直接使用绝对 Z 坐标
    # ============================================================================
    common_crop_box_filter:
      parameters:
        # -----------------------------------------------------------------------
        # 裁剪框 X 轴最小范围（车辆后方距离，单位：米，base_link 坐标系）默认值-100
        #   ↑ 增大（更负）：保留更多后方点云 → 可感知后方来车，但增加计算量
        #   ↓ 减小（更接近 0）：裁剪更多后方点云 → 减少计算量，但可能丢失后方障碍物
        # -----------------------------------------------------------------------
        min_x: -0.5
        # -----------------------------------------------------------------------
        # 裁剪框 X 轴最大范围（车辆前方距离，单位：米，base_link 坐标系）
        #   ↑ 增大：保留更远前方点云 → 更早发现障碍物，但增加计算量
        #   ↓ 减小：裁剪更近前方点云 → 减少计算量，但可能丢失远处关键障碍物
        # -----------------------------------------------------------------------
        max_x: 150.0
        # -----------------------------------------------------------------------
        # 裁剪框 Y 轴最小范围（车辆左侧距离，单位：米，base_link 坐标系）默认值-70
        #   ↑ 增大（更负）：保留更多左侧点云，适合多车道/宽路面场景
        #   ↓ 减小（更接近 0）：裁剪左侧点云 → 减少计算量，适合窄路
        # -----------------------------------------------------------------------
        min_y: -3.0
        # -----------------------------------------------------------------------
        # 裁剪框 Y 轴最大范围（车辆右侧距离，单位：米，base_link 坐标系）默认值70
        #   ↑ 增大：保留更多右侧点云
        #   ↓ 减小：裁剪右侧点云 → 减少计算量
        # -----------------------------------------------------------------------
        max_y: 3.0
        # -----------------------------------------------------------------------
        # 从车辆高度向上扩展裁剪框 max_z 的边距（单位：米）
        #   实际 max_z = vehicle_height + margin_max_z
        #   ↑ 增大：保留更高处的点云（如高架标志牌、桥梁底部）→ 可能多检出障碍物
        #   ↓ 减小：只关注地面附近的点 → 可能丢失高位障碍物（如卡车顶部）
        # -----------------------------------------------------------------------
        margin_max_z: 1.0
        # -----------------------------------------------------------------------
        # 从地面向下扩展裁剪框 min_z 的边距（单位：米）
        #   实际 min_z = ground_z + margin_min_z
        #   ↑ 增大（更负）：保留更深的地下点 → 可处理下坡/凹陷地形
        #   ↓ 减小（更接近 0）：裁剪指向下方的点 → 减少地面以下的噪声点
        # -----------------------------------------------------------------------
        margin_min_z: -2.5
        # -----------------------------------------------------------------------
        # 是否反转裁剪逻辑
        #   False（默认）: 保留裁剪框内的点
        #   True         : 保留裁剪框外的点（取反）
        #   通常保持 False
        # -----------------------------------------------------------------------
        negative: False
        # -----------------------------------------------------------------------
        # 处理时间阈值（单位：秒）
        #   ↑ 增大：减少警告输出
        #   ↓ 减小：更早发现性能瓶颈，但可能产生过多噪声警告
        #   仅用于性能诊断，不影响算法结果
        # -----------------------------------------------------------------------
        processing_time_threshold_sec: 0.01

    # ============================================================================
    # 通用地面滤波器参数 (ScanGroundFilterComponent)
    #   作用：将点云分离为地面点和非地面点（障碍物候选）
    #
    #   算法概述：
    #   - elevation_grid_mode=true (推荐/当前配置):
    #     使用极坐标高程网格 (Polar Grid) 算法
    #     1. 将点云按径向 (grid_size_m) 和方位角 (radial_divider_angle_deg) 划分网格
    #     2. 每个网格用最低点/均值初始化地面高度
    #     3. 通过最小二乘拟合估计局部地面坡度
    #     4. 根据 global_slope / local_slope / non_ground_height_threshold 分类
    #     5. 可选 use_recheck_ground_cluster 二次验证
    #
    #   - elevation_grid_mode=false (传统/非网格模式):
    #     使用射线扫描 (Ray-based) 算法
    #     1. 按 radial_divider_angle_deg 将点云分成射线扇区
    #     2. 沿每条射线逐点比较坡度和高度差
    #     3. 使用 split_height_distance / split_points_distance_tolerance 判断邻接关系
    #     4. use_virtual_ground_point 提供地面参考
    # ============================================================================
    common_ground_filter:
      # 地面分割插件名称（不可修改）
      plugin: "ground_segmentation::ScanGroundFilterComponent"
      parameters:
        # =======================================================================
        # global_slope_max_angle_deg [度] — 全局地面坡度阈值
        #   定义：全局地面允许的最大倾斜角度
        #   用途（网格模式）：高度 > tan(angle) * 径向距离 → 判定为障碍物
        #           （非网格模式）：z / radius > tan(angle) → 判定为非地面
        #   ↑ 增大（如 5~10°）：允许斜坡、坡道上的点被识别为地面
        #     → 减少在坡道上的误检（把坡面当障碍物），但可能把低矮障碍物漏检为地面
        #   ↓ 减小（如 0°）：仅允许完全平坦的地面
        #     → 对障碍物更敏感（不易漏检），但在斜坡/颠簸路面会大范围误检
        #   当前值 0.0 = 仅接受绝对水平地面（最严格，适合平坦城市道路）
        # =======================================================================
        global_slope_max_angle_deg: 0.0
        # =======================================================================
        # local_slope_max_angle_deg [度] — 局部地面坡度阈值
        #   定义：相邻点之间的地面允许的最大局部坡度变化
        #   用途（网格模式）：相邻网格间高度差 < tan(angle) * 径向距离差 → 同一地面
        #           （非网格模式）：相邻点坡度变化 < local_slope_max_angle → 同一地面
        #   ↑ 增大（如 30°）：允许地面有较大起伏（适合非铺装路面、工地）
        #     → 更多点被归类为地面，减少把起伏地面误判为障碍物
        #   ↓ 减小（如 0°）：要求地面严格平滑
        #     → 更多点被归类为障碍物，可能在颠簸路面产生大量误检
        #   当前值 0.0 = 仅接受完全平滑地面
        #   NOTE: 非 elevation_grid_mode 下官方建议 30.0°，因为射线模式下
        #         局部坡度判断更敏感，需要更大阈值来容忍路面不平整
        # =======================================================================
        local_slope_max_angle_deg: 0.0
        # =======================================================================
        # split_points_distance_tolerance [米] — 分割点距离容差
        #   用途：仅非网格模式 (elevation_grid_mode=false)
        #   定义：判断两个相邻点是否"接近"的额外距离容差
        #   实际阈值 = point.radius * radial_divider_angle_rad + 此容差
        #   ↑ 增大：更多点被认为"接近"，使用地面聚类平均值判断（更宽松）
        #     → 减少地面断裂，但可能漏检小障碍物
        #   ↓ 减小：更多点被认为"远离"，单独与参考点比较（更严格）
        #     → 对小障碍物更敏感，但可能产生地面碎片化
        #   NOTE: 当前使用 elevation_grid_mode=true，此参数不影响
        # =======================================================================
        split_points_distance_tolerance: 0.2
        # =======================================================================
        # use_virtual_ground_point — 使用虚拟地面参考点
        #   用途：仅非网格模式 (elevation_grid_mode=false)
        #   定义：当射线扇区缺乏近处地面观测时，在 wheel_base 距离处插入
        #         一个虚拟地面点 (z=0) 作为地面判断的参考起点
        #   True : 即使近处无地面点也能正确判断（推荐，适合传感器安装较高的情况）
        #   False: 仅使用实际观测到的最近点作为参考 → 近处无地面时可能误判
        #   NOTE: 当前使用 elevation_grid_mode=true，此参数不影响
        # =======================================================================
        use_virtual_ground_point: True
        # =======================================================================
        # split_height_distance [米] — 分割高度距离
        #   用途：仅非网格模式 (elevation_grid_mode=false)
        #   定义：判断相邻点是否属于同一平面的高度差阈值
        #   两个相邻点的高度差 < 此值 → 认为属于同一地面
        #   ↑ 增大（如 0.2）：更宽松的地面判断 → 更多点归为地面
        #     → 减少地面误分割，但可能把低矮路缘石/减速带也当成地面
        #   ↓ 减小（如 0.01）：更严格 → 即使微小高度变化也认为是障碍物
        #     → 对路缘石、小障碍物敏感，但可能造成地面碎片化
        #   NOTE: 当前使用 elevation_grid_mode=true，此参数不影响
        # =======================================================================
        split_height_distance: 0.02
        # =======================================================================
        # non_ground_height_threshold [米] — 非地面高度阈值
        #   定义：绝对高度差阈值，超过此高度的点被认为是障碍物
        #   用途（网格模式 - 主要场景）：
        #     1. 初始化：点高度 > global_slope阈值 且 > 此值 → 障碍物
        #     2. 连续网格：相邻网格高度差 > 此值 + local_slope阈值 → 断点
        #     3. 复核阶段：地面点高度 > reference_height + 此值 → 重分类为障碍物
        #   ↑ 增大（如 0.3~0.5）：只有较高的物体才算障碍物
        #     → 低矮障碍物（路缘石、减速带、小石块）可能被忽略
        #     → 适合粗糙路面，减少地面误检
        #   ↓ 减小（如 0.05~0.1）：对低矮物体更敏感
        #     → 能检出路面上的小物体，但可能在颠簸路面产生大量误检
        #   当前值 0.2m = 20cm，适合典型城市道路场景
        # =======================================================================
        non_ground_height_threshold: 0.1
        # =======================================================================
        # grid_size_m [米] — 高程网格分辨率（径向）
        #   定义：极坐标网格中每个单元的径向尺寸
        #   用途：仅网格模式 (elevation_grid_mode=true)
        #   ↑ 增大（如 0.5）：网格更粗糙 → 每个格包含更多点，计算更快
        #     → 但分辨率降低，小障碍物可能被"淹没"在大量地面点中
        #   ↓ 减小（如 0.1）：网格更精细 → 对细小障碍物更敏感
        #     → 但每个格点数量减少，统计稳定性下降；总网格数增多，计算量增大
        #   当前值 0.2m = 20cm 分辨率
        # =======================================================================
        grid_size_m: 0.1
        # =======================================================================
        # gnd_grid_buffer_size [格数] — 地面网格缓冲区大小
        #   定义：用于估计局部地面坡度的历史地面网格数量
        #   用途：仅网格模式 (elevation_grid_mode=true)
        #   算法在 classify() 中通过 recursiveSearch 收集最近 N 个已确认的地面网格，
        #   用最小二乘法拟合直线 → 估计当前局部地面坡度，结果被 clamp 到
        #   global_slope_max_ratio 范围内
        #   ↑ 增大（如 8~12）：使用更远的网格做坡度估计 → 对局部噪声更鲁棒
        #     → 坡度估计更平滑，但可能忽略真实的地形突变（坡道切换点）
        #   ↓ 减小（如 1~2）：仅使用最近的网格 → 坡度估计更灵敏
        #     → 更快响应地形变化，但容易受噪声影响（单个异常网格会干扰估计）
        #   当前值 4 为平衡值
        # =======================================================================
        gnd_grid_buffer_size: 4
        # =======================================================================
        # detection_range_z_max [米] — Z 轴检测范围上限
        #   定义：点相对于地面的最大高度差，超过此值的点被标记为"超出检测范围"
        #         (既不是地面也不是障碍物，被丢弃不输出)
        #   用途：仅网格模式 (elevation_grid_mode=true)
        #         在 segment 阶段，如果 |delta_z| > 此值 → 点被跳过
        #   ↑ 增大（如 20.0）：保留所有高处的点
        #     → 可能把高架桥底部、树冠等也当成障碍物
        #   ↓ 减小（如 2.0）：只关注地面附近物体
        #     → 可能丢失高处悬挂物（如栏杆、树枝），但可过滤高架桥底部噪声
        #   当前值 10.0m 涵盖典型车辆/行人高度
        # =======================================================================
        detection_range_z_max: 10.0
        # =======================================================================
        # detection_range_z_min [米] — Z 轴检测范围下限
        #   ↑ 增大（更负）：保留更深处的地下点
        #   ↓ 减小（更接近 0）：过滤地面以下的噪声点
        #   NOTE: 此参数在 scan_ground_filter 的 schema 中未直接定义，
        #         可能用于 crop_box_filter 的 min_z 约束或其他后处理阶段
        # =======================================================================
        detection_range_z_min: -10.0
        # =======================================================================
        # elevation_grid_mode — 高程网格模式开关
        #   true （推荐）: 使用极坐标网格算法 (GridGroundFilter)
        #     → 优点：抗噪声能力强、对坡度估计更准确、支持 low_priority_region_x
        #     → 缺点：计算量略大（取决于 grid_size_m 和 radial_divider_angle_deg）
        #   false        : 使用传统射线扫描算法
        #     → 优点：算法更简单直接、适合稀疏点云
        #     → 缺点：对噪声敏感，地面连续性较差
        #   当改为 false 时，建议：
        #     - local_slope_max_angle_deg 调大到 30.0
        #     - 仔细调 split_height_distance 和 split_points_distance_tolerance
        # =======================================================================
        elevation_grid_mode: true
        # =======================================================================
        # use_recheck_ground_cluster — 地面聚类二次验证
        #   定义：在初次地面分类完成后，对每个网格中的"地面点"进行复核
        #   用途：仅网格模式 (elevation_grid_mode=true)
        #   复核逻辑：
        #     - use_lowest_point=true  → 以网格最低点高度为参考
        #     - use_lowest_point=false → 以网格平均高度为参考
        #     - 任何地面点高度 > 参考高度 + non_ground_height_threshold → 重分类为障碍物
        #     - 仅在网格平均半径 > recheck_start_distance 时执行
        #   True : 减少假阳性地面误判（推荐）
        #     → 某些被错误标识为地面的低矮障碍物会被修正
        #     → 但增加少量计算开销
        #   False: 直接使用初次分类结果
        #     → 速度更快，但可能有地面中混入的障碍物点未被过滤
        # =======================================================================
        use_recheck_ground_cluster: true
        # =======================================================================
        # recheck_start_distance [米] — 地面复核起始距离
        #   定义：仅在距离自车超过此距离的网格上执行地面复核
        #   用途：仅网格模式 + use_recheck_ground_cluster=true 时生效
        #   ↑ 增大（如 40.0）：仅在远处做复核
        #     → 近处保持更宽松的地面判断，适合近距离需要保留更多信息的场景
        #   ↓ 减小（如 5.0）：近处也开始复核
        #     → 对近处障碍物更敏感，但可能造成近处地面碎片化
        #   当前值 20.0m：20m 内不做复核，20m 外做复核
        #   原理：近处点云密集，初始分类已经足够准确；远处点稀疏，需要复核纠错
        # =======================================================================
        recheck_start_distance: 20.0
        # =======================================================================
        # use_lowest_point — 使用最低点作为参考高度
        #   定义：地面复核时，选择网格内地面点的参考高度方式
        #   用途：仅网格模式 + use_recheck_ground_cluster=true 时生效
        #   True : 用网格内地面点的最小 Z 值作为参考高度
        #     → 更保守的地面判断，只把明显高于最低点的点标记为障碍物
        #     → 适合有起伏但整体平滑的路面
        #   False: 用网格内地面点的平均 Z 值作为参考高度
        #     → 更激进，高于平均值的点可能被重分类为障碍物
        #     → 适合非常平坦的路面，对微小凸起敏感
        # =======================================================================
        use_lowest_point: true
        # =======================================================================
        # low_priority_region_x [米] — 低优先级区域 X 边界
        #   NOTE: 此参数在当前代码中已被声明加载，但算法中暂未使用。
        #         属于预留参数，原本设计用于在车辆后方区域降低地面检测灵敏度。
        #   预期行为（未来实现时）：
        #     X < 此值的区域 → 地面分割更宽松（允许更大坡度/高度差异）
        #   当前设置 -20.0m 无实际影响
        # =======================================================================
        low_priority_region_x: -20.0
        # =======================================================================
        # center_pcl_shift [米] — 点云中心 X 轴偏移
        #   定义：虚拟激光雷达原点沿 X 轴（车辆前进方向）的偏移量
        #   用途：仅网格模式 (elevation_grid_mode=true)
        #   实际虚拟原点 X = wheel_base / 2 + center_pcl_shift
        #   ↑ 正值：将虚拟原点前移（适合前装激光雷达）
        #   ↓ 负值：将虚拟原点后移（适合后装或顶装激光雷达）
        #   当前值 0.0：无偏移，使用车辆中心作为极坐标原点
        #   多激光雷达融合时可能需要分别调整各雷达的偏移
        # =======================================================================
        center_pcl_shift: 0.0
        # =======================================================================
        # radial_divider_angle_deg [度] — 径向分割角分辨率
        #   定义：将 360° 点云等分为扇区的角度宽度
        #   扇区总数 = ceil(360° / 此值)，例如 0.5° → 720 个扇区
        #   每个扇区内独立进行地面估计
        #   ↑ 增大（如 1.0~2.0°）：扇区更宽更少 → 每个扇区包含更多点
        #     → 地面估计更稳定（大数定律），但角度分辨率降低
        #     → 可能无法区分角度接近的不同物体
        #     → 计算速度更快
        #   ↓ 减小（如 0.1°）：扇区更窄更多 → 每个扇区点更少
        #     → 角度分辨率更高，精细区分物体方向
        #     → 但每个扇区可能点数不足，影响统计稳定性
        #     → 计算量增大
        #   当前值 0.5° = 720 扇区
        # =======================================================================
        radial_divider_angle_deg: 0.5

        # =======================================================================
        # 调试参数
        # =======================================================================
        # publish_processing_time_detail [bool] — 发布详细处理时间
        #   True : 发布每个阶段的耗时（用于性能分析和瓶颈定位）
        #   False: 不发布（减少 topic 数量和系统负载）
        #   仅在调试性能问题时开启
        # =======================================================================
        publish_processing_time_detail: false
