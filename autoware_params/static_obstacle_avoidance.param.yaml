/**:
  ros__parameters:
    # ==========================================================================
    # 静态障碍物避让模块 (static_obstacle_avoidance)
    #
    # 功能概述：
    #   检测并规避道路上的静态物体（如停放车辆、路障等），通过生成横向偏移轨迹
    #   或减速停车来保证行车安全。
    #
    # 工作原理：
    #   1. 检测前方道路上的静态物体（基于感知模块输入）
    #   2. 过滤并分类障碍物（车辆、行人、自行车等）
    #   3. 评估可行驶区域（同向车道、路肩、自由空间等）
    #   4. 生成横向偏移路径（向左或向右绕行）或减速/停车策略
    #   5. 安全校验（检查绕行路径是否与其他道路使用者冲突）
    #   6. 输出最终避障轨迹
    #
    # 参数调优总览：
    #   增大阈值 → 更保守（更早避让、更大安全距离、更平滑的路径）
    #   减小阈值 → 更激进（更晚避让、更贴近障碍物、更快速的绕行动作）
    #   注：具体影响因参数而异，详见各参数注释。
    # ==========================================================================
    avoidance:
      # ========================================================================
      # 1. 路径重采样参数
      # ========================================================================
      # 规划时路径重采样的间距 [m]
      #   值越小 → 路径点越密 → 规划精度越高，路径更平滑，但计算量增大
      #   值越大 → 路径点越稀 → 计算更快，但可能遗漏细节导致路径不够精确
      #   典型范围: 0.1 ~ 1.0
      resample_interval_for_planning: 0.3
      # 输出路径时重采样的间距 [m]，用于平滑最终轨迹
      #   值越小 → 输出轨迹点更密集，控制精度更高
      #   值越大 → 输出轨迹更稀疏，减小后续模块的计算负担
      #   通常设得比 planning 间距大一些，以平滑小幅度抖动
      resample_interval_for_output: 0.5

      # ========================================================================
      # 2. 可行驶区域/车道使用策略
      #   决定避障路径可以在哪些区域生成。
      # ========================================================================
      # 允许使用的车道类型
      #   "same_direction_lane"    : 仅使用同向车道（更保守，不借用对向车道）
      #   "opposite_direction_lane": 可借用对向车道（更灵活，但需确保对向无来车）
      #   选择 same_direction_lane → 避障空间受限，可能无法绕过宽大障碍物
      #   选择 opposite_direction_lane → 避障空间更大，但安全风险增加
      # official default: use_lane_type: "opposite_direction_lane"
      use_lane_type: "same_direction_lane"
      # 是否使用路口区域进行避让
      #   true  → 允许在路口内生成避障路径，增加绕行空间
      #   false → 路口内不进行避让，更安全但可能无法绕过路口附近的障碍物
      use_intersection_areas: true
      # 是否使用斜线区域（hatched road markings，通常禁止驶入的标线区域）
      #   true  → 允许压过斜线区域绕行，增加了可绕行空间
      #   false → 严格遵守标线，不驶入斜线区域，更遵守交规但可能无法避让
      use_hatched_road_markings: true
      # 是否使用自由空间（如无标线的开阔区域，如停车场、广场等）
      #   true  → 允许使用无标线区域绕行，大幅扩展可行驶范围
      #   false → 仅在标线车道内行驶，更保守
      use_freespace_areas: true

      # ========================================================================
      # 3. 目标物体模型参数 (target_object)
      #   为每一类障碍物单独定义运动判定阈值和安全边界。
      #   不同物体类型有不同的默认边距，反映对不同障碍物的谨慎程度。
      # ========================================================================
      target_object:
        # ======================================================================
        # 小型车 (car)
        # ======================================================================
        car:
          # 判定为运动物体的最低速度 [m/s]，低于此值视为静止物体进入避障考虑
          #   值越大 → 更多慢速移动的车辆被当作静止障碍物处理，避让更频繁
          #   值越小 → 只有几乎完全停止的车辆才触发避让，减少不必要的绕行
          # official default: th_moving_speed: 1.0
          th_moving_speed: 1.0
          # 静止物体被重新判定为运动所需的最小连续运动时间 [s]
          #   值越大 → 物体一旦被判为静止，需要更长时间持续运动才能重新归类为运动
          #           避免因短暂移动（如车辆微调位置）导致的避让策略反复切换
          #   值越小 → 物体状态切换更灵敏，但可能导致避让决策抖动
          # official default: th_moving_time: 2.0
          th_moving_time: 2.0
          # 物体纵向（前后方向）额外附加的安全距离 [m]
          #   值越大 → 在障碍物前后方预留更多安全空间，避障路径开始偏移更早、结束更晚
          #   值越小 → 更贴近障碍物前后端开始/结束绕行，路径更紧凑
          longitudinal_margin: 0.0
          lateral_margin:
            # 软边界：允许避障路径轻微侵入的横向距离 [m]
            #   值越大 → 允许路径更靠近障碍物（更激进），绕行幅度更小
            #   值越小 → 路径与障碍物保持更远距离（更保守），绕行幅度更大
            #   注意：软边界与硬边界的逻辑相反——soft_margin 越大表示允许更多"侵入"，
            #   因此更激进；增大 hard_margin 则是更保守。
            # official default: soft_margin: 0.7
            soft_margin: 0.35
            # 硬边界：绝对不允许侵入的横向距离 [m]
            #   值越大 → 障碍物周围的安全禁区更大，路径必须离得更远（更保守）
            #   值越小 → 安全禁区更小，可以更贴近障碍物绕行（更激进）
            #   当 soft_margin 和 hard_margin 冲突时，hard_margin 优先级更高
            # official default: hard_margin: 0.2
            hard_margin: 0.4
            # 停放车辆的特殊硬边界 [m]（专门针对停放车辆的更严格安全距离）
            #   值越大 → 对停放车辆保持更大距离（更保守），因为停放车辆可能突然开门
            #   值越小 → 更贴近停放车辆通过（更激进）
            # official default: hard_margin_for_parked_vehicle: 0.7
            hard_margin_for_parked_vehicle: 0.2
          # 物体形状的最大膨胀系数（0.0 ~ 1.0，0.0 表示不膨胀）
          #   值越大 → 障碍物边界被膨胀更多，预留更多安全空间（更保守）
          #   值越小 → 使用原始检测边界，更紧凑
          max_expand_ratio: 0.0
          # 包络缓冲区余量 [m]，用于补偿定位误差或物体形状检测误差
          #   值越大 → 障碍物外扩更大，安全裕度更高（更保守），但可能导致不必要的绕行
          #   值越小 → 更依赖原始检测精度，避障路径更紧凑
          envelope_buffer_margin: 0.1
          # 椭圆近似时长轴半径的误差阈值 [m]
          #   当物体形状用椭圆近似时，长轴半径误差超过此值则可能触发重新计算
          #   值越大 → 容忍更大的形状近似误差，减少重新计算次数
          #   值越小 → 对形状变化更敏感，更频繁更新椭圆模型
          th_error_eclipse_long_radius : 0.6

        # ======================================================================
        # 卡车 (truck)
        #   卡车体积大、盲区大，通常需要更大的安全距离。
        #   各参数含义与 car 相同，此处仅标注与 car 不同的值的含义。
        # ======================================================================
        truck:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.0
          lateral_margin:
            # soft_margin 设为 0.5（比 car 的 0.35 大），允许避障路径更靠近卡车
            # 原因：卡车体积大，若保持过大距离可能无法正常通行
            # official default: soft_margin: 0.7
            soft_margin: 0.5
            # hard_margin 设为 0.2（比 car 的 0.4 小），硬安全禁区更小
            # 原因：在狭窄道路上需要更紧凑的绕行空间
            hard_margin: 0.2
            # official default: hard_margin_for_parked_vehicle: 0.7
            hard_margin_for_parked_vehicle: 0.2
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius : 0.6

        # ======================================================================
        # 公交车 (bus)
        #   与卡车类似，体积大且可能频繁停靠，参数设置与卡车相同。
        # ======================================================================
        bus:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.0
          lateral_margin:
            # official default: soft_margin: 0.7
            soft_margin: 0.5
            hard_margin: 0.2
            # official default: hard_margin_for_parked_vehicle: 0.7
            hard_margin_for_parked_vehicle: 0.2
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius : 0.6

        # ======================================================================
        # 拖挂车 (trailer)
        #   拖挂车车身更长，转弯时尾部摆动大，参数设置与卡车相同。
        # ======================================================================
        trailer:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.0
          lateral_margin:
            # official default: soft_margin: 0.7
            soft_margin: 0.5
            hard_margin: 0.2
            # official default: hard_margin_for_parked_vehicle: 0.7
            hard_margin_for_parked_vehicle: 0.2
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius : 0.6

        # ======================================================================
        # 未知类型 (unknown)
        #   对未识别类型的物体采用更保守的策略：更大的安全边距和缓冲区。
        # ======================================================================
        unknown:
         # 判定为运动物体的最低速度 [m/s]，低于此值视为静止物体进入避障考虑
          #   值越大 → 更多慢速移动的车辆被当作静止障碍物处理，避让更频繁
          #   值越小 → 只有几乎完全停止的车辆才触发避让，减少不必要的绕行
          # official default: th_moving_speed: 1.0
          th_moving_speed: 2.0
          # 静止物体被重新判定为运动所需的最小连续运动时间 [s]
          #   值越大 → 物体一旦被判为静止，需要更长时间持续运动才能重新归类为运动
          #           避免因短暂移动（如车辆微调位置）导致的避让策略反复切换
          #   值越小 → 物体状态切换更灵敏，但可能导致避让决策抖动
          # official default: th_moving_time: 2.0
          th_moving_time: 2.0
          # 物体纵向（前后方向）额外附加的安全距离 [m]
          #   值越大 → 在障碍物前后方预留更多安全空间，避障路径开始偏移更早、结束更晚
          #   值越小 → 更贴近障碍物前后端开始/结束绕行，路径更紧凑
          longitudinal_margin: 0.0
          lateral_margin:
            # 软边界：允许避障路径轻微侵入的横向距离 [m]
            #   值越大 → 允许路径更靠近障碍物（更激进），绕行幅度更小
            #   值越小 → 路径与障碍物保持更远距离（更保守），绕行幅度更大
            #   注意：软边界与硬边界的逻辑相反——soft_margin 越大表示允许更多"侵入"，
            #   因此更激进；增大 hard_margin 则是更保守。
            # official default: soft_margin: 0.7
            soft_margin: 0.8
            # 硬边界：绝对不允许侵入的横向距离 [m]
            #   值越大 → 障碍物周围的安全禁区更大，路径必须离得更远（更保守）
            #   值越小 → 安全禁区更小，可以更贴近障碍物绕行（更激进）
            #   当 soft_margin 和 hard_margin 冲突时，hard_margin 优先级更高
            # official default: hard_margin: 0.2
            hard_margin: -0.2
            # 停放车辆的特殊硬边界 [m]（专门针对停放车辆的更严格安全距离）
            #   值越大 → 对停放车辆保持更大距离（更保守），因为停放车辆可能突然开门
            #   值越小 → 更贴近停放车辆通过（更激进）
            # official default: hard_margin_for_parked_vehicle: 0.7
            hard_margin_for_parked_vehicle: 0.0
          # 物体形状的最大膨胀系数（0.0 ~ 1.0，0.0 表示不膨胀）
          #   值越大 → 障碍物边界被膨胀更多，预留更多安全空间（更保守）
          #   值越小 → 使用原始检测边界，更紧凑
          max_expand_ratio: 0.2
          # 包络缓冲区余量 [m]，用于补偿定位误差或物体形状检测误差
          #   值越大 → 障碍物外扩更大，安全裕度更高（更保守），但可能导致不必要的绕行
          #   值越小 → 更依赖原始检测精度，避障路径更紧凑
          envelope_buffer_margin: 0.3
          # 椭圆近似时长轴半径的误差阈值 [m]
          #   当物体形状用椭圆近似时，长轴半径误差超过此值则可能触发重新计算
          #   值越大 → 容忍更大的形状近似误差，减少重新计算次数
          #   值越小 → 对形状变化更敏感，更频繁更新椭圆模型
          th_error_eclipse_long_radius : 1.0

        # ======================================================================
        # 自行车 (bicycle)
        #   自行车速度慢、体积小、可能突然改变方向，需要适当的纵向安全距离。
        # ======================================================================
        bicycle:
          # th_moving_speed 设为 0.28（较低）
          #   原因：自行车速度慢，较高阈值会导致行驶中的自行车被误判为静止
          th_moving_speed: 0.28
          # th_moving_time 设为 1.0（较短）
          #   原因：自行车启动快，状态变化应快速响应
          th_moving_time: 1.0
          # longitudinal_margin 设为 0.6（比 car 大）
          #   原因：自行车可能突然变向，需要更多纵向反应空间
          #   - 值越大 → 提前更多距离开始避让
          #   - 值越小 → 更靠近自行车才开始绕行
          # official default: longitudinal_margin: 1.0
          longitudinal_margin: 0.6
          lateral_margin:
            soft_margin: 0.7
            hard_margin: 0.5
            # official default: hard_margin_for_parked_vehicle: 0.5
            hard_margin_for_parked_vehicle: 0.2
          max_expand_ratio: 0.0
          # envelope_buffer_margin 设为 0.5（较大）
          #   原因：自行车体积小，检测框可能不稳定，需要更大缓冲
          envelope_buffer_margin: 0.5
          th_error_eclipse_long_radius : 0.6

        # ======================================================================
        # 摩托车 (motorcycle)
        #   摩托车速度快、机动性强，与自行车类似需要适当安全距离。
        # ======================================================================
        motorcycle:
          th_moving_speed: 1.0
          th_moving_time: 1.0
          # longitudinal_margin 设为 0.6
          #   原因：摩托车加速快，需要预留足够的纵向反应距离
          # official default: longitudinal_margin: 1.0
          longitudinal_margin: 0.6
          lateral_margin:
            # soft_margin 设为 0.5
            # official default: soft_margin: 0.7
            soft_margin: 0.5
            hard_margin: 0.3
            # official default: hard_margin_for_parked_vehicle: 0.3
            hard_margin_for_parked_vehicle: 0.2
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.5
          th_error_eclipse_long_radius : 0.6

        # ======================================================================
        # 行人 (pedestrian)
        #   行人是最需要保护的交通参与者，需要最大的安全裕度。
        # ======================================================================
        pedestrian:
          # th_moving_speed 设为 0.28（很低）
          #   原因：行人移动速度慢，必须用低阈值来正确识别静止/运动状态
          th_moving_speed: 0.28
          # th_moving_time 设为 1.0（较短）
          #   原因：行人行为变化快，状态判定需快速响应
          th_moving_time: 1.0
          # longitudinal_margin 设为 0.6（较大的纵向安全距离）
          #   原因：行人可能突然横穿，需要更多的纵向反应时间
          # official default: longitudinal_margin: 1.0
          longitudinal_margin: 0.6
          lateral_margin:
            # soft_margin 设为 0.7，hard_margin 设为 0.5（均较大）
            #   原因：行人是最脆弱的道路使用者，需最大横向安全距离
            soft_margin: 0.7
            hard_margin: 0.5
            # official default: hard_margin_for_parked_vehicle: 0.5
            hard_margin_for_parked_vehicle: 0.2
          max_expand_ratio: 0.0
          # 包络缓冲区余量 [m]，用于补偿定位误差或物体形状检测误差
          #   值越大 → 障碍物外扩更大，安全裕度更高（更保守），但可能导致不必要的绕行
          #   值越小 → 更依赖原始检测精度，避障路径更紧凑
          envelope_buffer_margin: 0.5

          th_error_eclipse_long_radius : 0.6

        # 多边形膨胀的最小/最大距离 [m]
        #   障碍物距离在 [lower, upper] 范围内时使用多边形膨胀来简化形状
        #   lower_distance 越大 → 远距离障碍物才使用多边形膨胀，近距离使用更精确的形状
        #   upper_distance 越大 → 更远距离的障碍物也使用多边形膨胀
        #   超出 upper 范围的障碍物不使用多边形膨胀（用更简单的模型替代）
        #   注意：多边形膨胀会增加计算量
        lower_distance_for_polygon_expansion: 30.0
        upper_distance_for_polygon_expansion: 100.0

      # ========================================================================
      # 4. 目标过滤 (target_filtering)
      #   决定哪些物体在什么条件下进入避障考虑范围。
      #   过滤掉不相关或不可靠的目标，避免不必要的避让。
      # ========================================================================
      target_filtering:
        # 开启过滤的物体类型
        #   true  → 该类型物体参与避障判断
        #   false → 完全忽略该类型物体，即使前方有该类型障碍物也不避让
        #   例如：如果关闭 pedestrian，则不会为行人执行避让
        target_type:
          car: true
          truck: true
          bus: true
          trailer: true
          unknown: true
          bicycle: true
          motorcycle: true
          pedestrian: true

        # 距离终点多远时开始检查目标 [m]
        #   值越大 → 距离终点更远时就停止避让判断，避免在终点附近做无意义的绕行
        #   值越小 → 即使靠近终点也会进行避让，确保全程安全
        #   设为 0 表示一直到终点都进行障碍物检查
        # official default: object_check_goal_distance: 20.0
        object_check_goal_distance: 0.5
        # 距离回程姿态多远时检查目标 [m]（用于掉头/折返场景）
        #   值越大 → 在回程姿态前方更远距离就开始考虑避障
        #   值越小 → 仅在接近回程姿态时才检查
        # official default: object_check_return_pose_distance: 20.0
        object_check_return_pose_distance: 3.0

        # 物体跟踪丢失后的最大补偿时间 [s]
        #   当感知模块暂时丢失某个障碍物的跟踪时，在此时间内仍将其视为存在
        #   值越大 → 对跟踪丢失更宽容，减少因短暂丢失导致的避让策略反复
        #           但可能对已消失的物体继续避让
        #   值越小 → 跟踪一旦丢失立即停止避让，响应更快但可能不稳定
        max_compensation_time: 2.0

        # 检测区域参数
        #   定义自车周围多大范围内的障碍物会被纳入避障考虑。
        detection_area:
          # 是否对静态物体进行检测
          #   true  → 检测并避让静态物体（本模块的核心功能）
          #   false → 不检测静态物体，仅依赖动态物体避让（此时本模块几乎无作用）
          # official default: static: false
          static: true
          # 前向检测的最小距离 [m]（在此距离内的障碍物不做避让处理）
          #   值越大 → 近距离障碍物不触发避让（可能因为太近已无法安全绕行，应直接停车）
          #   值越小 → 更近距离的障碍物也会尝试绕行
          #   作用：防止对已经太近的障碍物做出不安全的绕行尝试
          # official default: min_forward_distance: 50.0
          min_forward_distance: 20.0
          # 前向检测的最大距离 [m]（超出此距离的障碍物不触发避让）
          #   值越大 → 更早发现前方障碍物，更早开始规划避让路径（更平稳）
          #           但检测和规划的计算量增大
          #   值越小 → 仅考虑较近的障碍物，计算更快但可能在高速下来不及平滑避让
          # official default: max_forward_distance: 150.0
          max_forward_distance: 30.0
          # 后向检测距离 [m]（考虑后方障碍物，主要用于安全校验）
          #   值越大 → 检测更远的后方来车，更安全（尤其是在借用对向车道后返回时）
          #   值越小 → 仅考虑近距离后方物体
          # official default: backward_distance: 10.0
          backward_distance: 3.0

        # 停放车辆判定参数
        #   用于区分"行驶中临时停车"和"真正停放"的车辆。
        parked_vehicle:
          # 物体中心距车道中心线的阈值 [m]，超过此值可能判定为停放车辆
          #   值越大 → 只有偏离车道中心线很远的车辆才被判为停放（更宽松）
          #   值越小 → 略微偏离车道中心线的车辆就可能被判为停放（更严格）
          #   设为 0 表示不基于中心线偏移量来做停放判定
          # official default: th_offset_from_centerline: 1.0
          th_offset_from_centerline: 0.0
          # 可绕行空间的比例阈值 [0~1]，低于该值认为无法安全避让
          #   值越大 → 需要更多可绕行空间才进行避让（更保守），否则直接停车等待
          #   值越小 → 即使可绕行空间很小也尝试避让（更激进），但可能通过很窄的空间
          #   例如：设为 0.8 表示需要 80% 的车道宽度可用来绕行才执行避让
          # official default: th_shiftable_ratio: 0.8
          th_shiftable_ratio: 0.4
          # 最小路肩宽度 [m]，路肩宽于此值才认为有额外绕行空间
          #   值越大 → 需要更宽的路肩才认为可以利用，减少可绕行场景
          #   值越小 → 较窄的路肩也认为可利用，增加绕行机会
          min_road_shoulder_width: 0.2

        # 汇入车辆的超出距离 [m]
        #   用于判定汇入车辆（如从匝道汇入）是否对本车道构成障碍
        #   值越大 → 更远的汇入车辆也会被考虑
        merging_vehicle:
          th_overhang_distance: 0.0

        # 分类不稳定时间 [s]
        #   当感知模块对障碍物类型分类频繁变化时，在此时间内忽略该物体
        #   值越大 → 更长时间忽略分类不稳定的物体（减少误判，但可能漏掉真实障碍物）
        #   值越小 → 更快接受最新的分类结果（响应更快，但可能因分类错误而做出不当避让）
        # official default: unstable_classification_time: 2.0
        unstable_classification_time: 2.0

        # 针对模糊/不确定车辆的避障策略
        #   当感知模块无法确定某车辆的行为意图时（如正在汇入、正在偏离车道等），
        #   此策略决定如何处理。
        avoidance_for_ambiguous_vehicle:
          # policy: "manual" → 人工干预，不自动避让
          # policy: "auto"   → 自动判断并执行避让
          #   "auto" 更激进，会在不确定情况下也执行避让
          #   "manual" 更保守，不确定时交由人工决策
          # official default: policy: "manual"
          policy: "auto"
          condition:
            # 停止超过此时间才考虑避让 [s]
            #   值越大 → 需要物体更长时间保持静止才确认为障碍物（更保守）
            #   值越小 → 短暂停止即触发避让判断（更灵敏，但可能误触发）
            th_stopped_time: 1.0          # 停止超过该时间才考虑避让,默认3 [s]
            # 移动超过此距离才重新判定为运动状态 [m]
            #   值越大 → 物体需要移动更大距离才能从"避让目标"中移除
            #           防止因微小移动导致避让策略取消
            #   值越小 → 物体稍有移动即取消避让
            th_moving_distance: 1.0       # 移动超过该距离才重新判定 [m]
          ignore_area:
            traffic_light:
              # 信号灯前忽略区域的范围 [m]
              #   值越大 → 信号灯前更大范围内不执行避让（因为车辆可能在等红灯，无需绕行）
              #   值越小 → 仅在信号灯很近时才忽略
              front_distance: 20.0        # 信号灯前忽略区域的范围 [m]
            crosswalk:
              # 人行横道前忽略避让的范围 [m]
              #   值越大 → 人行横道前更大范围内不避让（避免在斑马线附近绕行）
              front_distance: 20.0        # 人行横道前忽略范围 [m]
              # 人行横道后忽略避让的范围 [m]
              behind_distance: 0.0        # 人行横道后忽略范围 [m]
          wait_and_see:
            # 等待观察的目标行为类型
            #   "MERGING"   : 正在汇入的车辆（可能很快离开本车道）
            #   "DEVIATING" : 正在偏离车道的车辆（可能只是临时偏航）
            #   对这些行为采取"等待观察"策略，而非立即避让
            target_behaviors: ["MERGING", "DEVIATING"]  # 等待观察的目标行为
            # 最近距离阈值 [m]，若物体距离小于此值则不再等待，立即执行避让
            #   值越大 → 更远距离就结束等待，开始执行避让（更安全）
            #   值越小 → 即使距离较近也继续观察等待（更耐心，但可能风险更大）
            th_closest_distance: 10.0     # 最近距离阈值 [m]

        # 针对违章停车车辆的避让策略
        #   policy: "ignore" → 不主动避让违章停车车辆（依赖其他模块或人工处理）
        #   policy: "auto"   → 自动生成避让路径
        avoidance_for_parking_violation_vehicle:
          policy: "auto"
          condition:
            # 距道路边界的距离阈值 [m]
            #   距道路边界小于此距离的停车可能被判定为违章停车
            #   值越大 → 更多停车被归类为违章停车
            th_road_border_distance: 0.8  # 距道路边界的距离阈值 [m]

        # 针对邻车道停止车辆的避让策略
        #   邻车道有停止车辆时，本车是否需要避让（防止"鬼探头"或突然开门）
        #   policy: "auto"   → 自动避让邻车道停止车辆（更安全）
        #   policy: "ignore" → 忽略邻车道停止车辆（更高效，但注意潜在风险）
        avoidance_for_adjacent_lane_stop_vehicle:
          policy: "auto"

        # 针对近距离车辆的避让策略
        #   policy: "ignore" → 忽略已非常接近的车辆（因为距离太近，避让空间不足）
        #   policy: "auto"   → 仍尝试避让（可能导致不安全的急转）
        avoidance_for_close_vehicle:
          policy: "auto"

        # 路口处的偏航角偏差阈值 [rad]（约 20°）
        #   在路口内，自车偏航角与此值的偏差用于判断是否处于转弯状态
        #   值越大 → 更多姿态被视为"直行"而非转向
        intersection:
          yaw_deviation: 0.349

        # 自由空间中判定静态物体的停止时间 [s]
        #   在自由空间（如停车场）中，物体需停止超过此时间才被视为静态障碍物
        #   值越大 → 需要更长时间确认物体为静态（减少误判，停车场中常见短暂停车）
        #   值越小 → 更快将停止物体识别为障碍物
        freespace:
          condition:
            th_stopped_time: 2.0

      # ========================================================================
      # 5. 安全校验 (safety_check)
      #   验证生成的避让轨迹是否与周围道路使用者（尤其是后方来车和侧方车辆）
      #   发生潜在冲突。若校验不通过，则放弃避让或选择更安全的策略。
      # ========================================================================
      safety_check:
        # 参与安全校验的物体类型
        #   true  → 对该类型物体进行安全校验
        #   false → 安全校验时忽略该类型（可能导致碰撞风险）
        target_type:
          car: true
          truck: true
          bus: true
          trailer: true
          # official default: unknown: false
          unknown: true
          bicycle: true
          motorcycle: true
          pedestrian: true

        # 是否启用安全校验（此处禁用）
        #   true  → 启用安全校验，不安全的避让路径会被否决（更安全但可能无法避让）
        #   false → 跳过安全校验，总是执行避让（更激进，风险更高）
        #   注意：禁用安全校验意味着不会检查后方来车、侧方车辆等风险！
        # official default: enable: true
        enable: false
        # 是否检查当前车道（自车所在车道是否有其他车辆）
        #   true → 检查当前车道，若有冲突则阻止避让
        check_current_lane: false
        # 是否检查目标偏移侧的车道（绕行方向侧的车道）
        #   true → 检查绕行方向是否有来车，防止绕行时与侧方车辆碰撞
        check_shift_side_lane: true
        # 是否检查另一侧车道（非绕行方向侧）
        #   true  → 双向检查，更全面但更保守，可能阻止更多避让
        #   false → 仅检查绕行侧，更宽松
        # official default: check_other_side_lane: false
        check_other_side_lane: true
        # 是否检查无法避开的物体
        #   true → 若存在完全无法避让的物体，安全校验失败
        check_unavoidable_object: true
        # 是否检查其他物体（不在当前/相邻车道但可能相关的物体）
        #   true → 更全面的安全校验
        check_other_object: true
        # 是否检查所有预测路径（考虑其他车辆的未来轨迹）
        #   true  → 基于预测轨迹进行更全面的碰撞检测（更安全但计算量大）
        #   false → 仅基于当前状态检测
        check_all_predicted_path: false
        # 向后检查的安全距离 [m]，检查后方多远距离内的车辆
        #   值越大 → 检测更远的后方来车（更安全，尤其高速场景）
        #   值越小 → 仅关心近距离后方车辆（计算更快）
        # official default: safety_check_backward_distance: 100.0
        safety_check_backward_distance: 10.0
        # 安全边界膨胀的迟滞因子
        #   当安全状态变化时，用于平滑安全边界的膨胀速度
        #   值越大 → 安全边界膨胀更快（更保守的响应，更早预警）
        #   值越小 → 安全边界膨胀更慢（更平稳但响应稍慢）
        hysteresis_factor_expand_rate: 1.5
        # 安全计数所需的迟滞帧数
        #   需要连续多少帧确认安全后才认为真正安全
        #   值越大 → 需要更长时间确认安全，减少误报但响应变慢
        #   值越小 → 更快确认安全，但可能因噪声导致误判
        hysteresis_factor_safe_count: 3
        # 碰撞检查时的航向角差阈值 [rad]（约 180°）
        #   当自车与目标物体的航向角差超过此值，认为可能发生碰撞
        #   值越大 → 更宽松的碰撞判定（减少误报）
        #   值越小 → 更严格的碰撞判定（更安全）
        collision_check_yaw_diff_threshold: 3.1416
        # 安全校验中考虑的最低自车速度 [m/s]，低于此速度不进行安全校验
        #   值越大 → 低速时不检查（低速下碰撞风险低），减少不必要的校验
        #   值越小 → 更低速度也会进行安全校验
        # official default: min_velocity: 1.38
        min_velocity: 0.3
        # 安全校验中考虑的最高自车速度 [m/s]
        max_velocity: 50.0
        # 时间分辨率 [s]，碰撞预测的时间步长
        #   值越小 → 碰撞预测更精细（更准确但计算量增大）
        #   值越大 → 计算更快但可能漏掉短时间内的碰撞
        time_resolution: 0.5
        # 前方物体的时间窗口 [s]，预测前方物体在此时间内的运动
        #   值越大 → 预测更远的未来（更保守，但不确定性高）
        #   值越小 → 仅预测近期（更可靠但可能忽略远期风险）
        time_horizon_for_front_object: 3.0
        # 后方物体的时间窗口 [s]，预测后方物体在此时间内的运动
        #   值越大 → 更早发现后方追尾风险（更安全，高速时建议增大）
        #   值越小 → 仅考虑近期后方风险
        time_horizon_for_rear_object: 10.0
        # 起步前的延迟时间 [s]，停车后重新起步前的等待时间
        #   值越大 → 停车后等待更久才重新起步（更安全，确认周围情况）
        #   值越小 → 停车后更快重新起步
        delay_until_departure: 0.0
        # 扩展多边形的策略
        #   "along_path" → 沿路径方向扩展障碍物多边形（考虑自车未来轨迹）
        extended_polygon_policy: "along_path"
        # 前方车辆预期的减速度 [m/s²]
        #   值越负（绝对值越大）→ 假设前车刹车更猛，碰撞预测更保守（更安全）
        #   值越接近 0 → 假设前车缓慢减速，预测更乐观
        expected_front_deceleration: -1.0
        # 后方车辆预期的减速度 [m/s²]
        #   值越负（绝对值越大）→ 假设后车刹车更猛，追尾风险降低（更乐观）
        #   值越接近 0 → 假设后车不减速，追尾风险预估更高（更保守）
        expected_rear_deceleration: -1.0
        # 后方车辆反应时间 [s]，后车从感知到开始刹车的时间
        #   值越大 → 假设后车反应更慢，追尾风险预估更高（更保守，会更多阻止避让）
        #   值越小 → 假设后车反应更快，追尾风险更低（更乐观）
        rear_vehicle_reaction_time: 2.0
        # 后方车辆安全时间裕度 [s]，额外的安全缓冲时间
        #   值越大 → 需要更大的时间裕度确认安全（更保守）
        #   值越小 → 更紧凑的时间裕度（更激进）
        rear_vehicle_safety_time_margin: 1.0
        # 横向距离的最大阈值 [m]，超出此横向距离的物体不参与安全校验
        #   值越大 → 更远的侧方物体也参与校验（更全面）
        #   值越小 → 仅关心近距离侧方物体
        lateral_distance_max_threshold: 2.0
        # 纵向距离的最小阈值 [m]，小于此纵向距离的物体必须参与校验
        #   值越大 → 更远的前后物体也强制参与校验（更保守）
        #   值越小 → 仅强制校验非常近的物体
        longitudinal_distance_min_threshold: 3.0
        # 纵向速度差的时间增量 [s]，用于计算速度差
        longitudinal_velocity_delta_time: 0.0

      # ========================================================================
      # 6. 避障执行参数 (avoidance)
      #   控制避障路径的生成方式，分为横向（偏移）和纵向（减速）两个维度。
      # ========================================================================
      avoidance:
        # ----------------------------------------------------------------------
        # 横向控制参数
        #   控制自车绕行时的横向偏移量、偏移速度、可行驶区域边界等。
        # ----------------------------------------------------------------------
        lateral:
          # 触发避让的最小横向偏移量 [m]
          #   只有当计算出的必要偏移量大于此值时才执行避让
          #   值越大 → 小幅度绕行被抑制，只有需要较大偏移的障碍物才执行避让
          #           减少不必要的轻微绕行，车辆行驶更稳定
          #   值越小 → 即使很小的偏移也会执行（更灵敏），但可能导致频繁微调
          th_avoid_execution: 0.1
          # 视为"小偏移"的横向长度阈值 [m]
          #   用于区分"轻微绕行"和"大幅度绕行"，影响路径平滑策略
          #   值越大 → 更多绕行被视为小偏移，使用更宽松的平滑策略
          #   值越小 → 只有非常小的偏移才被视为小偏移
          # official default: th_small_shift_length: 0.101
          th_small_shift_length: 0.05
          # 软可行驶边界余量 [m]，允许路径轻微超出车道边界
          #   值越大 → 允许更多超出车道边界（更灵活，但可能压线或越线）
          #   值越小 → 更严格保持在车道内（更保守）
          soft_drivable_bound_margin: 0.7
          # 硬可行驶边界余量 [m]，绝对不可超越的边界
          #   值越大 → 可行驶区域向内收缩更多（更保守，远离道路边界）
          #   值越小 → 可行驶区域更贴近实际道路边界（更充分利用道路空间）
          # official default: hard_drivable_bound_margin: 0.3
          hard_drivable_bound_margin: 0.1
          # 允许向右偏移的最大距离 [m]（从车道中心线起算）
          #   值越大 → 允许更大幅度的右侧绕行，可绕过更宽的障碍物
          #   值越小 → 右侧绕行受限，可能导致只能向左绕或无法绕过
          #   当前值 0.2 较小，用于测试阶段打破左右摇摆问题
          # official default: max_right_shift_length: 5.0
          # 静态绕障测试阶段临时压低右绕上限，用于打破正中障碍物左右候选抖动。
          max_right_shift_length: 2.0
          # 允许向左偏移的最大距离 [m]（从车道中心线起算）
          #   值越大 → 允许更大幅度的左侧绕行（可能借对向车道）
          #   值越小 → 左侧绕行受限
          #   若左右最大偏移都不足以绕过障碍物，则采取停车策略
          # official default: max_left_shift_length: 5.0
          max_left_shift_length: 4.0
          # 允许偏离车道中心的最大距离 [m]
          #   限制自车在任何情况下偏离车道中心线的总距离
          #   值越大 → 允许更大幅度偏离车道中心（更灵活的绕行）
          #   值越小 → 紧贴车道中心行驶，绕行能力受限
          # official default: max_deviation_from_lane: 0.2
          max_deviation_from_lane: 2.0
          # 返回原车道的偏移量比例阈值
          #   当已完成的返回偏移量占总偏移量的比例超过此值时，批准返回动作
          #   值越大 → 需要接近完全返回才批准（更保守，确保安全返回）
          #   值越小 → 完成较小比例即批准返回（更早返回原车道）
          ratio_for_return_shift_approval: 0.5

        # ----------------------------------------------------------------------
        # 纵向控制参数
        #   控制避障时的减速行为：何时减速、减到多慢、以及避障时的目标速度。
        # ----------------------------------------------------------------------
        longitudinal:
          # 准备减速/停车的最短时间 [s]
          #   值越大 → 预留更多准备时间（更早开始减速，更平滑但可能过早减速）
          #   值越小 → 更晚开始减速准备（响应更快但可能急刹）
          # official default: min_prepare_time: 1.0
          min_prepare_time: 0.1
          # 准备减速/停车的最长时间 [s]
          #   值越大 → 允许更长的减速准备阶段（更平滑的减速）
          #   值越小 → 必须在更短时间内完成减速准备（更急促）
          # official default: max_prepare_time: 3.0
          max_prepare_time: 0.2
          # 准备阶段的最小距离 [m]
          #   值越大 → 在更远距离就开始减速准备（更保守）
          #   值越小 → 更靠近障碍物才开始准备（更激进）
          min_prepare_distance: 0.1
          # min_prepare_distance: 1.0
          # 减速/停车的最低速度 [m/s]，减速的目标速度
          #   值越大 → 避障时保持较高速度通过（更高效但风险更高）
          #   值越小 → 避障时速度更低（更安全但通行效率低）
          #   设为 0 则可能完全停车等待
          # official default: min_slow_down_speed: 1.38
          min_slow_down_speed: 0.3
          # 减速/停车的缓冲速度增量 [m/s]
          #   实际目标减速速度 = min_slow_down_speed + buf_slow_down_speed
          #   值越大 → 减速后的实际速度更高（留有更多速度余量）
          #   值越小 → 减速后速度更接近 min_slow_down_speed
          buf_slow_down_speed: 0.56
          # 标称避障速度 [m/s]，正常避障时推荐的目标速度
          #   值越大 → 绕行时保持较高速度（更高效，适合高速公路场景）
          #   值越小 → 绕行时速度较低（更安全，适合城市道路场景）
          #   若低于此速度则加速至此速度进行绕行
          # official default: nominal_avoidance_speed: 8.33
          nominal_avoidance_speed: 1.0
          # 是否考虑前悬长度（车头到前轮的距离）
          #   true  → 考虑前悬，更精确地计算自车轮廓，避免车头扫到障碍物
          #   false → 忽略前悬，简化计算但可能低估自车占用空间
          consider_front_overhang: true
          # 是否考虑后悬长度（后轮到车尾的距离）
          #   true  → 考虑后悬，更精确地计算自车轮廓
          #   false → 忽略后悬
          consider_rear_overhang: true

        # ----------------------------------------------------------------------
        # 返回截止线（死线）参数
        #   定义必须完成避障返回的最后期限，通常设置在终点或信号灯前。
        #   超过截止线后不再允许开始新的避障。
        # ----------------------------------------------------------------------
        return_dead_line:
          goal:
            # 是否在终点前使用截止线
            #   true  → 终点前一段距离禁止开始新避障，确保在终点前恢复正常行驶
            #   false → 终点前仍可避障
            enable: false                 # 是否在终点前使用截止线
            # 截止线前的缓冲距离 [m]
            #   值越大 → 更早结束避障，在终点前有更多距离恢复正常行驶
            #   值越小 → 更靠近终点仍可避障
            # official default: buffer: 3.0
            buffer: 0.5                  # 截止线前的缓冲距离 [m]
          traffic_light:
            # 是否在信号灯前使用截止线
            #   true  → 信号灯前禁止开始新避障（避免在路口附近做复杂绕行动作）
            #   false → 信号灯前仍可避障（风险较高）
            enable: true                 # 是否在信号灯前使用截止线
            # 信号灯前缓冲距离 [m]
            #   值越大 → 在信号灯前更远距离就停止避障，确保路口区域安全
            #   值越小 → 更靠近信号灯仍可避障
            buffer: 3.0                  # 缓冲距离 [m]

      # ========================================================================
      # 7. 取消/中止避障条件 (cancel)
      #   定义什么情况下中止正在进行的避障动作。
      # ========================================================================
      cancel:
        # 是否允许取消避让
        #   true  → 当条件不满足时（如障碍物消失）可以中止正在进行的避障
        #   false → 一旦开始避障就必须完成，即使障碍物已消失
        #   设为 false 可防止因障碍物状态变化导致的避障路径中途变更
        # official default: enable: true
        enable: true                    # 是否允许取消避让
        force:
          # 强制取消的持续时间 [s]，发出取消指令后等待此时间强制中止
          #   值越大 → 取消过程更平滑，给控制模块更多时间响应
          #   值越小 → 更快中止避障
          duration_time: 5.0             # 强制取消的持续时间,默认参数2.0 [s]

      # ========================================================================
      # 8. 让行/等待参数 (yield)
      #   定义何时对某些障碍物采取"等待"而非"绕行"的策略。
      # ========================================================================
      yield:
        # 是否启用让行功能
        #   true  → 当判断绕行风险较高时选择停车等待而非绕行
        #   false → 总是尝试绕行而非等待（更激进）
        # official default: enable: true
        enable: true                   # 是否启用让行
        # 横向偏移期间是否允许让行
        #   true  → 绕行过程中如果出现新的危险也允许临时停车等待
        #   false → 绕行过程中不会停车等待（更连贯但风险可能增加）
        enable_during_shifting: false    # 横向偏移期间是否允许让行
        # 让行时是否开启转向灯
        #   true  → 停车等待时打双闪或转向灯提示后方
        #   false → 不开启信号灯
        enable_signalling_during_yield: false  # 让行时是否开启转向灯

      # ========================================================================
      # 9. 停止参数 (stop)
      #   定义避障失败或绕行不可行时的停车行为。
      # ========================================================================
      stop:
        # 触发停车的最大障碍物距离 [m]
        #   障碍物距离小于此值且无法绕行时，触发停车
        #   值越大 → 在更远距离就开始考虑停车（更保守，停车更平稳）
        #   值越小 → 更靠近障碍物才停车（更激进，可能急刹）
        max_distance: 20.0               # 触发停车的最大障碍物距离 [m]
        # 停车点前的缓冲距离 [m]
        #   值越大 → 在障碍物前更远处停车（更安全）
        #   值越小 → 更贴近障碍物停车
        stop_buffer: 1.0                 # 停车点前的缓冲距离 [m]

      # ========================================================================
      # 10. 避障策略 (policy)
      #   定义避障行为的高层策略偏好。
      # ========================================================================
      policy:
        # 检测可靠性等级
        #   "reliable"   → 仅相信高置信度的检测结果（减少误检导致的错误避让）
        #   "best_effort" → 使用所有检测结果（可能因误检而执行不必要的避让）
        #   "reliable" 更保守（在感知层面），减少不必要的避让
        detection_reliability: "reliable"
        # 批准请求的方式
        #   "per_shift_line" → 针对每条生成的偏移路径单独请求批准
        #   "per_shift_line" 提供更细粒度的控制
        make_approval_request: "per_shift_line"
        # 减速策略
        #   "best_effort" → 尽量减速但不保证完全停止
        #   "strict"      → 严格按照计算的减速曲线执行
        #   "best_effort" 更灵活，适应更多场景
        deceleration: "best_effort"
        # 横向余量策略
        #   "best_effort" → 尽量满足横向安全余量但不强制
        #   "strict"      → 严格满足横向余量要求
        #   "best_effort" 允许在空间不足时适当压缩余量以完成避让
        lateral_margin: "best_effort"
        # 是否立即使用缩小的安全边界
        #   true  → 当无法满足完整安全边界时，立即使用缩小的边界（更快响应）
        #   false → 先尝试满足完整边界，失败后才缩小（更保守）
        use_shorten_margin_immediately: true
        # 候选路径的转向灯信号
        #   "none" → 不显示转向灯
        #   其他选项可指示绕行方向
        candidate_path_turn_signal: "none"
        # 批准保持期间转向灯亮起的持续时间 [s]
        #   值越大 → 转向灯闪烁更久
        turn_signal_on_approval_hold_duration: 3.0

      # ========================================================================
      # 11. 运动学约束 (constraints)
      #   限制横向和纵向的速度、加速度、加加速度（jerk），确保生成的轨迹
      #   满足车辆动力学限制和乘客舒适度要求。
      # ========================================================================
      constraints:
        # ----------------------------------------------------------------------
        # 横向约束
        #   控制绕行时的横向运动特性。
        # ----------------------------------------------------------------------
        lateral:
          # 速度断点 [m/s]，将速度域分为多个区间
          #   与 max_accel_values / min_jerk_values / max_jerk_values 一一对应
          #   当前设置：[低速, 中速, 高速] = [5km/h, 15km/h, 40km/h]
          velocity: [1.39, 4.17, 11.1]
          # 各速度段的最大横向加速度 [m/s²]
          #   值越大 → 绕行动作更快更敏捷（乘客可能感到不适，侧倾更大）
          #   值越小 → 绕行动作更平缓（更舒适但避障响应更慢）
          #   当前所有速度段均为 0.5，表示不随速度变化
          max_accel_values: [0.5, 0.5, 0.5]
          # 各速度段的最小横向 jerk [m/s³]（避让时和返回时分别设置）
          #   jerk 是加速度的变化率，决定了动作的"突兀"程度
          #   值越大（绝对值）→ 加速度变化更快，动作更干脆（乘客可能感到突兀）
          #   值越小（绝对值）→ 加速度变化更慢，动作更柔和（更舒适但响应慢）
          min_jerk_values:
            avoid: [0.2, 0.2, 0.2]
            return: [0.2, 0.2, 0.2]
          # 各速度段的最大横向 jerk [m/s³]
          #   值越大 → 允许更快的加速度变化（绕行更敏捷但不舒适）
          #   值越小 → 限制加速度变化速度（更舒适但绕行迟缓）
          #   当前设为 3.0（比默认 1.0 更大），绕行动作更敏捷
          # official default: max_jerk_values: [1.0, 1.0, 1.0]
          max_jerk_values: [3.0, 3.0, 3.0]

        # ----------------------------------------------------------------------
        # 纵向约束
        #   控制避障过程中的加速和减速行为。
        # ----------------------------------------------------------------------
        longitudinal:
          # 标称减速度 [m/s²]
          #   值越负（绝对值越大）→ 刹车更猛，减速更快（更安全但乘客不适）
          #   值越接近 0 → 减速更平缓（更舒适但制动距离更长）
          nominal_deceleration: -1.0      # 标称减速度 [m/s²]
          # 标称纵向 jerk [m/s³]
          #   值越大 → 刹车力度变化更快（制动更急促）
          #   值越小 → 刹车力度变化更慢（制动更柔和）
          nominal_jerk: 0.5               # 标称纵向 jerk [m/s³]
          # 最大减速度 [m/s²]，紧急情况下的减速度上限
          #   值越负（绝对值越大）→ 紧急制动能力更强（但乘客可能感到不适）
          #   值越接近 0 → 最大制动力受限
          max_deceleration: -1.5          # 最大减速度 [m/s²]
          # 最大纵向 jerk [m/s³]
          #   值越大 → 允许更剧烈的刹车力变化（紧急情况响应更快）
          #   值越小 → 限制刹车力变化速度（更舒适但紧急响应慢）
          max_jerk: 1.0                   # 最大纵向 jerk [m/s³]
          # 最大加速度 [m/s²]
          #   值越大 → 绕行完成后加速更快（更快恢复速度，通行效率高）
          #   值越小 → 加速更平缓（更舒适，节能）
          max_acceleration: 0.5           # 最大加速度 [m/s²]
          # 限制最大加速度的最低速度阈值 [m/s]（约 10 km/h）
          #   自车速度低于此值时，不限制加速度（允许全油门起步）
          #   值越大 → 在更高速度以下都不限制加速度（起步更快）
          #   值越小 → 仅在很低速度时才允许全加速度
          min_velocity_to_limit_max_acceleration: 2.78

      # ========================================================================
      # 12. 路径生成方法
      # ========================================================================
      # "shift_line_base" → 基于偏移线生成避障路径
      #   先计算车道中心线的横向偏移量，再基于偏移后的参考线生成平滑路径
      #   这是当前主要的路径生成方式，适合车道内有清晰参考线的场景
      path_generation_method: "shift_line_base"

      # ========================================================================
      # 13. 偏移线流水线参数 (shift_line_pipeline)
      #   控制偏移线生成过程中的修剪和平滑处理。
      # ========================================================================
      shift_line_pipeline:
        trim:
          # 量化尺寸 [m]，路径点坐标的量化精度
          #   值越大 → 路径更粗糙但计算更快
          #   值越小 → 路径更精细平滑但计算量增大
          quantize_size: 0.1              # 量化尺寸 [m]
          # 相似梯度阈值 1/2/3，用于路径修剪时判断相邻段的梯度相似性
          #   三个阈值从严格到宽松，用于不同阶段的修剪
          #   值越大 → 更多路径段被视为"相似"而合并（路径更简洁但可能丢失细节）
          #   值越小 → 保留更多路径细节（路径更精确但可能不够平滑）
          th_similar_grad_1: 0.1          # 相似梯度阈值1（最严格）
          th_similar_grad_2: 0.2          # 相似梯度阈值2（中等）
          th_similar_grad_3: 0.5          # 相似梯度阈值3（最宽松）

      # ========================================================================
      # 14. 调试可视化开关 (debug)
      #   控制 RViz 等可视化工具中显示的调试信息。
      #   仅影响可视化，不影响实际避障行为。
      # ========================================================================
      debug:
        # 显示其他物体标记（障碍物包围框等）
        enable_other_objects_marker: true
        # 显示其他物体信息（速度、类型、距离等文字标注）
        enable_other_objects_info: true
        # 显示检测区域（前向/后向检测范围的可视化）
        enable_detection_area_marker: true
        # 显示可行驶边界（车道边界、自由空间边界等）
        enable_drivable_bound_marker: true  # 显示可行驶边界,默认参数false
        # 显示安全校验信息（碰撞预测线、安全/危险区域等）
        enable_safety_check_marker: true     # 显示安全校验信息,默认参数false
        # 显示偏移线（生成的避障路径参考线）
        enable_shift_line_marker: true
        # 显示车道线
        enable_lane_marker: true             # 显示车道线,默认参数false
        # 显示杂项标记（其他调试信息）
        enable_misc_marker: true             # 显示杂项标记,默认参数false
